name: AUTO AI PR

on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH DEVELOP
        run: |
          git fetch origin develop --update-head-ok
          git fetch origin ${{ github.ref_name }}

      - name: 🔍 GET GIT DIFF
        run: |
          echo "Branch atual: ${{ github.ref_name }}"
          
          # Pega o diff entre develop e a branch atual
          git diff origin/develop...HEAD --no-color > diff.txt
          
          # Conta linhas para verificar se tem alterações
          DIFF_LINES=$(wc -l < diff.txt)
          
          if [ "$DIFF_LINES" -eq 0 ]; then
            echo "HAS_DIFF=false" >> $GITHUB_ENV
            echo "⚠️ Nenhuma alteração detectada."
          else
            echo "HAS_DIFF=true" >> $GITHUB_ENV
            echo "✅ Alterações encontradas ($DIFF_LINES linhas)"
          fi

      - name: 📝 GET GIT LOG
        if: env.HAS_DIFF == 'true'
        run: |
          # Pega todos os commits da branch em relação ao develop
          git log origin/develop...HEAD --pretty=format:"%h - %s" > commits.txt
          
          echo "📋 Commits encontrados:"
          cat commits.txt

      - name: 🤖 GENERATE AI DESCRIPTION
        id: ai
        if: env.HAS_DIFF == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🤖 Gerando descrição com IA..."

          # Limita o diff a 15000 caracteres para não estourar token
          DIFF_CONTENT=$(head -c 15000 diff.txt)
          COMMITS_CONTENT=$(cat commits.txt)

          # Cria um prompt mais detalhado e estruturado
          read -r -d '' PROMPT << 'EOF' || true
          Você é um engenheiro especialista em Pull Requests profissionais em português.

          Analise o diff e os commits abaixo e gere uma descrição profissional para uma Pull Request.

          ## COMMITS:
          ${COMMITS_CONTENT}

          ## DIFF (primeiros 15000 caracteres):
          ${DIFF_CONTENT}

          Retorne EXATAMENTE neste formato JSON:
          {
            "title": "Título com no máximo 65 caracteres, claro e objetivo",
            "description": "Descrição em markdown com:\n- O que foi feito\n- Por que foi feito\n- Como foi implementado\n- Se houver breaking changes, mencionar\n\nSeja específico e profissional."
          }

          IMPORTANTE: Retorne APENAS o JSON, sem markdown backticks, sem explicações adicionais.
          EOF

                    # Substitui as variáveis no prompt
                    PROMPT=$(eval "echo \"$PROMPT\"")

                    # Cria o request JSON de forma segura
                    REQUEST_BODY=$(cat <<'JSONEOF'
          {
            "model": "openai/gpt-4o-mini",
            "messages": [
              {
                "role": "system",
                "content": "Você é um engenheiro especialista em Pull Requests profissionais em português. Retorne APENAS JSON válido."
              },
              {
                "role": "user",
                "content": ""
              }
            ],
            "temperature": 0.3,
            "max_tokens": 1500
          }
          JSONEOF
          )

          # Adiciona o prompt ao request de forma segura
          REQUEST_BODY=$(echo "$REQUEST_BODY" | jq --arg prompt "$PROMPT" '.messages[0].content = $prompt')

          echo "📤 Enviando requisição para IA..."
          
          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "Response da API:" >&2
          echo "$RESPONSE" | jq . >&2

          # Extrai o conteúdo da resposta
          AI_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$AI_CONTENT" ]; then
            echo "❌ Erro ao chamar a IA. Usando título padrão."
            TITLE="feat: Atualização em ${{ github.ref_name }}"
            BODY="## 📝 PR Automática\n\nBranch: \`${{ github.ref_name }}\`\n\nAlterações detectadas. Descrição não disponível."
          else
            # Tenta extrair JSON da resposta
            AI_JSON=$(echo "$AI_CONTENT" | jq . 2>/dev/null || echo '{}')
            
            TITLE=$(echo "$AI_JSON" | jq -r '.title // empty')
            BODY=$(echo "$AI_JSON" | jq -r '.description // empty')

            # Se não conseguiu extrair, usa padrão
            if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
              TITLE="feat: Atualização em ${{ github.ref_name }}"
            fi
            if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
              BODY="## 📝 Alterações\n\nBranch: \`${{ github.ref_name }}\`"
            fi
          fi

          # Limpa o título (remove caracteres problemáticos e limita tamanho)
          TITLE=$(echo "$TITLE" | sed 's/["`'\'']//g' | cut -c1-65 | sed 's/[[:space:]]*$//')

          # Garante um título mínimo válido
          if [ -z "$TITLE" ] || [ ${#TITLE} -lt 5 ]; then
            TITLE="feat: ${{ github.ref_name }}"
          fi

          # Salva outputs
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "✅ Título gerado: $TITLE"
          echo "✅ Descrição gerada com sucesso"

      - name: 🚀 CREATE OR UPDATE PULL REQUEST
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          TITLE="${{ steps.ai.outputs.title }}"
          BODY="${{ steps.ai.outputs.body }}"

          # Busca PR existente
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "🚀 Criando nova Pull Request..."
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
            echo "✅ PR criada com sucesso!"
          else
            echo "🔄 Atualizando Pull Request #$PR_NUMBER..."
            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body "$BODY"
            echo "✅ PR atualizada com sucesso!"
          fi

      - name: ⏭️ SKIP - NO DIFF
        if: env.HAS_DIFF == 'false'
        run: echo "⏭️ Sem alterações para gerar PR. Nenhuma ação realizada."