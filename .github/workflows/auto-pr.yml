name: AUTO AI PR

on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-latest

    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: INSTALL JQ
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: GET GIT DIFF
        run: |
          git fetch origin develop

          git diff origin/develop..HEAD | head -c 15000 > diff.txt

          if [ ! -s diff.txt ]; then
            echo "HAS_DIFF=false" >> $GITHUB_ENV
          else
            echo "HAS_DIFF=true" >> $GITHUB_ENV
          fi

      - name: GENERATE AI DESCRIPTION
        id: ai
        if: env.HAS_DIFF == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |

          echo "GERANDO DESCRICAO IA..."

          DIFF_CONTENT=$(cat diff.txt)

          jq -n \
            --arg model "openai/gpt-4.1-mini" \
            --arg diff "$DIFF_CONTENT" \
            '{
              model: $model,
              messages: [
                {
                  role: "system",
                  content: "Você é um engenheiro especialista em gerar Pull Requests profissionais em português usando markdown."
                },
                {
                  role: "user",
                  content: ("Gere uma descrição profissional para este diff:\n\n" + $diff)
                }
              ],
              temperature: 0.3,
              max_tokens: 1000
            }' > request.json

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json)

          echo "$RESPONSE"

          BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            BODY="## PR AUTOMATICO\n\nBranch: ${{ github.ref_name }}"
            TITLE="PR: ${{ github.ref_name }}"
          else
            TITLE=$(echo "$BODY" | grep -v '^#' | grep -v '^$' | head -n 1 | cut -c1-80)

            if [ -z "$TITLE" ]; then
              TITLE="PR: ${{ github.ref_name }}"
            fi
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: CREATE OR UPDATE PR
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "📝 CRIANDO NOVO PR..."
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "${{ steps.ai.outputs.title }}" \
              --body "${{ steps.ai.outputs.body }}"
          else
            echo "🔄 ATUALIZANDO PR #$PR_NUMBER"
            gh pr edit "$PR_NUMBER" \
              --title "${{ steps.ai.outputs.title }}" \
              --body "${{ steps.ai.outputs.body }}"
          fi

          rm -f /tmp/diff.txt

      - name: SKIP - NO DIFF
        if: env.HAS_DIFF == 'false'
        run: echo "⚠️ Sem alterações - pulando criação do PR"
