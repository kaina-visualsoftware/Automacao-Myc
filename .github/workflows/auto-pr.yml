name: AUTO AI PR

on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-latest

    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: INSTALL JQ
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: GET GIT DIFF
        run: |
          git fetch origin develop

          git diff origin/develop..HEAD | head -c 15000 > diff.txt

          if [ ! -s diff.txt ]; then
            echo "HAS_DIFF=false" >> $GITHUB_ENV
          else
            echo "HAS_DIFF=true" >> $GITHUB_ENV
          fi

      - name: GENERATE AI DESCRIPTION
        id: ai
        if: env.HAS_DIFF == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |

          echo "GERANDO DESCRICAO IA..."

          DIFF_CONTENT=$(cat diff.txt)

          jq -n \
            --arg model "openai/gpt-4.1-mini" \
            --arg diff "$DIFF_CONTENT" \
            '{
              model: $model,
              messages: [
                {
                  role: "system",
                  content: "Você é um engenheiro especialista em gerar Pull Requests profissionais em português usando markdown."
                },
                {
                  role: "user",
                  content:
                    "Analise o diff e gere:\n\n" +
                    "1. Um TITULO CURTO com no máximo 75 caracteres.\n" +
                    "- O título deve resumir toda alteração.\n" +
                    "- Não use markdown no título.\n" +
                    "- Não use ```.\n" +
                    "- Não use aspas.\n" +
                    "- Não use prefixos como feat:, fix:, chore:.\n\n" +

                    "2. Uma DESCRIÇÃO COMPLETA em markdown contendo:\n" +
                    "- Resumo técnico\n" +
                    "- O que foi alterado\n" +
                    "- Impactos\n" +
                    "- Como testar\n\n" +

                    "RETORNE EXATAMENTE NESTE FORMATO:\n\n" +

                    "TITLE: titulo aqui\n\n" +
                    "BODY:\n" +
                    "# Descrição da Pull Request\n\n" +

                    "DIFF:\n\n" + $diff
                }
              ],
              temperature: 0.3,
              max_tokens: 1200
            }' > request.json

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json)

          echo "$RESPONSE"

          AI_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$AI_CONTENT" ] || [ "$AI_CONTENT" = "null" ]; then

            TITLE="PR: ${{ github.ref_name }}"
            BODY="## PR AUTOMATICO\n\nBranch: ${{ github.ref_name }}"

          else

            TITLE=$(echo "$AI_CONTENT" \
              | grep "^TITLE:" \
              | head -n 1 \
              | sed 's/^TITLE:[ ]*//')

            BODY=$(echo "$AI_CONTENT" \
              | sed -n '/^BODY:/,$p' \
              | sed '1d')

            TITLE=$(echo "$TITLE" \
              | cut -c1-75 \
              | sed 's/["`]//g')

            if [ -z "$TITLE" ]; then
              TITLE="PR: ${{ github.ref_name }}"
            fi

            if [ -z "$BODY" ]; then
              BODY="## PR AUTOMATICO\n\nBranch: ${{ github.ref_name }}"
            fi

          fi

          echo "TITLE FINAL: $TITLE"

          echo "title=$TITLE" >> $GITHUB_OUTPUT

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT


      - name: CREATE OR UPDATE PR
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          BRANCH="${{ github.ref_name }}"

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number')

          BODY_FILE="pr_body.md"

          echo '${{ steps.ai.outputs.body }}' \
            | sed 's/^```markdown//g' \
            | sed 's/^```//g' \
            > $BODY_FILE

          TITLE=$(cat $BODY_FILE \
            | grep -v '^#' \
            | grep -v '^$' \
            | head -n 1 \
            | cut -c1-80)

          if [ -z "$TITLE" ]; then
            TITLE="PR: $BRANCH"
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then

            echo "CRIANDO NOVO PR"

            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file $BODY_FILE

          else

            echo "ATUALIZANDO PR #$PR_NUMBER"

            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body-file $BODY_FILE

          fi

      - name: SKIP - NO DIFF
        if: env.HAS_DIFF == 'false'
        run: echo "⚠️ Sem alterações - pulando criação do PR"
