name: AUTO AI PR

on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH DEVELOP
        run: |
          git fetch origin develop --update-head-ok
          git fetch origin ${{ github.ref_name }}

      - name: 🔍 GET GIT DIFF
        run: |
          echo "Branch atual: ${{ github.ref_name }}"

          git diff origin/develop...HEAD --no-color > diff.txt

          DIFF_LINES=$(wc -l < diff.txt)

          if [ "$DIFF_LINES" -eq 0 ]; then
            echo "HAS_DIFF=false" >> $GITHUB_ENV
            echo "⚠️ Nenhuma alteração detectada."
          else
            echo "HAS_DIFF=true" >> $GITHUB_ENV
            echo "✅ Alterações encontradas ($DIFF_LINES linhas)"
          fi

      - name: 📝 GET GIT LOG
        if: env.HAS_DIFF == 'true'
        run: |
          git log origin/develop...HEAD --pretty=format:"%h - %s" > commits.txt

          echo "📋 Commits encontrados:"
          cat commits.txt

      - name: 📂 ANALYZE FILES CHANGED
        if: env.HAS_DIFF == 'true'
        run: |
          echo "🔍 Analisando arquivos alterados..."

          git diff --name-status origin/develop...HEAD > files_status.txt

          echo "=== ARQUIVOS CRIADOS ===" > files_analysis.txt
          git diff --name-status origin/develop...HEAD | grep "^A" | cut -f2 >> files_analysis.txt || true

          echo -e "\n=== ARQUIVOS MODIFICADOS ===" >> files_analysis.txt
          git diff --name-status origin/develop...HEAD | grep "^M" | cut -f2 >> files_analysis.txt || true

          echo -e "\n=== ARQUIVOS DELETADOS ===" >> files_analysis.txt
          git diff --name-status origin/develop...HEAD | grep "^D" | cut -f2 >> files_analysis.txt || true

          echo -e "\n=== ESTATÍSTICAS ===" >> files_analysis.txt
          echo "Total de arquivos criados: $(git diff --name-status origin/develop...HEAD | grep "^A" | wc -l)" >> files_analysis.txt
          echo "Total de arquivos modificados: $(git diff --name-status origin/develop...HEAD | grep "^M" | wc -l)" >> files_analysis.txt
          echo "Total de arquivos deletados: $(git diff --name-status origin/develop...HEAD | grep "^D" | wc -l)" >> files_analysis.txt

          echo -e "\n=== ALTERAÇÕES POR ARQUIVO ===" >> files_analysis.txt
          git diff --stat origin/develop...HEAD >> files_analysis.txt

          echo "✅ Análise concluída"

      - name: 📊 GET FILE CONTENT SUMMARY
        if: env.HAS_DIFF == 'true'
        run: |
          echo "📄 Gerando resumo dos arquivos..."

          > file_contents_summary.txt

          echo "=== RESUMO DE ARQUIVOS CRIADOS ===" >> file_contents_summary.txt

          git diff --name-status origin/develop...HEAD | grep "^A" | cut -f2 | while read file; do
            echo "" >> file_contents_summary.txt
            echo "FILE: $file" >> file_contents_summary.txt
            echo "---" >> file_contents_summary.txt

            git show HEAD:"$file" 2>/dev/null | head -100 >> file_contents_summary.txt

            echo "" >> file_contents_summary.txt
          done || true

          echo -e "\n=== DIFF PRINCIPAL ===" >> file_contents_summary.txt
          git diff origin/develop...HEAD --no-color | head -2000 >> file_contents_summary.txt

      ######################################################################
      # NVIDIA AI
      ######################################################################

      - name: 🤖 GENERATE AI DESCRIPTION WITH NVIDIA
        id: ai
        if: env.HAS_DIFF == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          echo "🤖 Gerando descrição usando NVIDIA API..."

          COMMITS_CONTENT=$(cat commits.txt)
          FILES_ANALYSIS=$(cat files_analysis.txt)
          FILE_CONTENTS=$(head -c 12000 file_contents_summary.txt)
          DIFF_CONTENT=$(head -c 15000 diff.txt)

          PROMPT=$(cat <<EOF
          Você é um engenheiro especialista em análise de código e Pull Requests profissionais.

          ## COMMITS
          ${COMMITS_CONTENT}

          ## ANÁLISE DE ARQUIVOS
          ${FILES_ANALYSIS}

          ## CONTEÚDO DOS ARQUIVOS
          ${FILE_CONTENTS}

          ## DIFF
          ${DIFF_CONTENT}

          Gere APENAS um JSON válido neste formato:

          {
            "title": "Título curto e profissional",
            "description": "# Descrição da Pull Request\n\n## Resumo Técnico\n..."
          }

          REGRAS:
          - NÃO use markdown fora do JSON
          - NÃO use backticks fora do JSON
          - Retorne APENAS JSON puro
          - Máximo 65 caracteres no title
          EOF
          )

          ##################################################################
          # CHAMADA NVIDIA CHAT COMPLETIONS
          ##################################################################

          RESPONSE=$(curl -s https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              '{
                model: "meta/llama-3.1-70b-instruct",
                messages: [
                  {
                    role: "system",
                    content: "Você é especialista em Pull Requests profissionais e análise de código."
                  },
                  {
                    role: "user",
                    content: $prompt
                  }
                ],
                temperature: 0.2,
                top_p: 0.7,
                max_tokens: 2000
              }'
            )")

          echo "📥 Resposta recebida"

          AI_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          echo "Conteúdo IA:"
          echo "$AI_CONTENT"

          if [ -z "$AI_CONTENT" ]; then
            echo "❌ Falha na IA NVIDIA"

            TITLE="feat: ${{ github.ref_name }}"
            BODY="## Alterações detectadas automaticamente"
          else
            AI_JSON=$(echo "$AI_CONTENT" | jq . 2>/dev/null)

            if [ $? -ne 0 ]; then
              echo "⚠️ Tentando corrigir JSON..."

              AI_JSON=$(echo "$AI_CONTENT" \
                | sed -n '/{/,$p' \
                | sed -n '/}/q;p' \
                | jq . 2>/dev/null || echo '{}')
            fi

            TITLE=$(echo "$AI_JSON" | jq -r '.title // empty')
            BODY=$(echo "$AI_JSON" | jq -r '.description // empty')

            if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
              TITLE="feat: ${{ github.ref_name }}"
            fi

            if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
              BODY="## Alterações detectadas automaticamente"
            fi
          fi

          TITLE=$(echo "$TITLE" \
            | sed 's/["`'\'']//g' \
            | cut -c1-65 \
            | sed 's/[[:space:]]*$//')

          echo "title=$TITLE" >> $GITHUB_OUTPUT

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "✅ Título final: $TITLE"

      - name: 🚀 CREATE OR UPDATE PULL REQUEST
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          TITLE="${{ steps.ai.outputs.title }}"
          BODY="${{ steps.ai.outputs.body }}"

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "🚀 Criando PR..."

            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"

            echo "✅ PR criada"
          else
            echo "🔄 Atualizando PR #$PR_NUMBER..."

            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body "$BODY"

            echo "✅ PR atualizada"
          fi

      - name: ⏭️ SKIP - NO DIFF
        if: env.HAS_DIFF == 'false'
        run: echo "⏭️ Sem alterações detectadas."