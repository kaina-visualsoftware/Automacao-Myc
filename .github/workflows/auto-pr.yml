name: AUTO AI PR

on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH DEVELOP
        run: |
          git fetch origin develop --update-head-ok
          git fetch origin "${{ github.ref_name }}"

      - name: 🔍 GET GIT DIFF
        run: |
          echo "Branch atual: ${{ github.ref_name }}"

          git diff origin/develop...HEAD --no-color > diff.txt

          DIFF_LINES=$(wc -l < diff.txt)

          if [ "$DIFF_LINES" -eq 0 ]; then
            echo "HAS_DIFF=false" >> $GITHUB_ENV
            echo "⚠️ Nenhuma alteração detectada."
          else
            echo "HAS_DIFF=true" >> $GITHUB_ENV
            echo "✅ Alterações encontradas ($DIFF_LINES linhas)"
          fi

      - name: 📝 GET GIT LOG
        if: env.HAS_DIFF == 'true'
        run: |
          git log origin/develop...HEAD \
            --pretty=format:"%h - %s" > commits.txt

          echo "📋 Commits encontrados:"
          cat commits.txt

      - name: 📂 ANALYZE FILES CHANGED
        if: env.HAS_DIFF == 'true'
        run: |
          echo "🔍 Analisando arquivos alterados..."

          git diff --name-status origin/develop...HEAD > files_status.txt

          {
            echo "=== ARQUIVOS CRIADOS ==="
            git diff --name-status origin/develop...HEAD | grep "^A" | cut -f2 || true

            echo ""
            echo "=== ARQUIVOS MODIFICADOS ==="
            git diff --name-status origin/develop...HEAD | grep "^M" | cut -f2 || true

            echo ""
            echo "=== ARQUIVOS DELETADOS ==="
            git diff --name-status origin/develop...HEAD | grep "^D" | cut -f2 || true

            echo ""
            echo "=== ESTATÍSTICAS ==="

            echo "Total de arquivos criados: $(git diff --name-status origin/develop...HEAD | grep "^A" | wc -l)"
            echo "Total de arquivos modificados: $(git diff --name-status origin/develop...HEAD | grep "^M" | wc -l)"
            echo "Total de arquivos deletados: $(git diff --name-status origin/develop...HEAD | grep "^D" | wc -l)"

            echo ""
            echo "=== ALTERAÇÕES POR ARQUIVO ==="

            git diff --stat origin/develop...HEAD

          } > files_analysis.txt

          echo "✅ Análise de arquivos concluída"

      - name: 📊 GET FILE CONTENT SUMMARY
        if: env.HAS_DIFF == 'true'
        run: |
          echo "📄 Gerando resumo de conteúdo..."

          > file_contents_summary.txt

          echo "=== RESUMO DE ARQUIVOS CRIADOS ===" >> file_contents_summary.txt

          git diff --name-status origin/develop...HEAD \
            | grep "^A" \
            | cut -f2 \
            | while read file; do

              echo "" >> file_contents_summary.txt
              echo "FILE: $file" >> file_contents_summary.txt
              echo "---" >> file_contents_summary.txt

              git show HEAD:"$file" 2>/dev/null \
                | head -100 \
                | strings \
                >> file_contents_summary.txt

              echo "" >> file_contents_summary.txt
            done

          echo "" >> file_contents_summary.txt
          echo "=== RESUMO DE DIFF ===" >> file_contents_summary.txt

          git diff origin/develop...HEAD --no-color \
            | head -2000 \
            | strings \
            >> file_contents_summary.txt

          echo "✅ Resumo de conteúdo gerado"

      - name: 🤖 GENERATE AI DESCRIPTION
        id: ai
        if: env.HAS_DIFF == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e

          echo "🤖 Gerando PR automática..."

          COMMITS_CONTENT=$(cat commits.txt | strings)
          FILES_ANALYSIS=$(cat files_analysis.txt | strings)

          FILE_CONTENTS=$(cat file_contents_summary.txt | strings | head -c 4000)
          DIFF_CONTENT=$(cat diff.txt | strings | head -c 6000)


          echo "📝 Gerando título da PR..."

          TITLE_PROMPT="Gere apenas um título profissional para Pull Request.
          REGRAS OBRIGATÓRIAS:
          - MÍNIMO: 40 caracteres
          - MÁXIMO: 70 caracteres
          - NÃO ultrapasse 70 caracteres
          - NÃO use markdown
          - NÃO use aspas
          - NÃO use emojis
          - NÃO use ponto final
          - RESPONDA SOMENTE O TÍTULO
          - NÃO explique nada
          - NÃO use quebra de linha
          - O título DEVE terminar em palavra completa

          EXEMPLO VÁLIDO:
          Refatora workflow de PR automático com validações

          COMMITS:
          $COMMITS_CONTENT

          ARQUIVOS:
          $FILES_ANALYSIS"

          TITLE_REQUEST=$(jq -n \
            --arg prompt "$TITLE_PROMPT" \
            '{
              model: "mistralai/mistral-large-3-675b-instruct-2512",

              response_format: {
                type: "text"
              },

              messages: [
                {
                  role: "system",
                  content: "Você gera títulos curtos de Pull Request e deve obedecer rigorosamente limites de caracteres."
                },
                {
                  role: "user",
                  content: $prompt
                }
              ],

              temperature: 0.0,
              top_p: 0.1,
              max_tokens: 40
            }')

          TITLE_RESPONSE=$(curl -s https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$TITLE_REQUEST")

          echo "🔍 Debug título:"
          echo "$TITLE_RESPONSE"

          TITLE=$(echo "$TITLE_RESPONSE" \
            | jq -r '.choices[0].message.content // empty' 2>/dev/null)

          TITLE=$(echo "$TITLE" \
            | tr -d '\n\r' \
            | sed 's/["`]//g' \
            | sed 's/[[:space:]]*$//')

          TITLE_LENGTH=${#TITLE}

          if [ -z "$TITLE" ] || [ "$TITLE_LENGTH" -gt 74 ] || [ "$TITLE_LENGTH" -lt 20 ]; then
            echo "⚠️ Título inválido. Usando fallback."

            TITLE="feat: atualização automática da branch ${{ github.ref_name }}"
          fi

          echo "✅ Título final: $TITLE"

          echo "📄 Gerando descrição..."


          PROMPT=$(cat <<EOF
          Você é um engenheiro especialista em análise de código e Pull Requests profissionais em português.

          ## INFORMAÇÕES DA PULL REQUEST

          ### COMMITS REALIZADOS:
          ${COMMITS_CONTENT}

          ### ANÁLISE DE ARQUIVOS:
          ${FILES_ANALYSIS}

          ### AMOSTRA DE CONTEÚDO DOS ARQUIVOS:
          ${FILE_CONTENTS}

          ### DIFF DO CÓDIGO:
          ${DIFF_CONTENT}

          ## INSTRUÇÃO

          Analise os commits, arquivos alterados e diff enviados.

          Gere APENAS um JSON válido.

          REGRAS OBRIGATÓRIAS:
          - NÃO copie placeholders do exemplo
          - NÃO escreva textos genéricos
          - NÃO use frases como:
            "Descreva o que mudou"
            "Passo 1 para testar"
            "Texto aqui"
          - TODAS as seções DEVEM ser preenchidas com conteúdo real
          - Se não houver conteúdo para uma seção, remova a seção
          - NÃO invente arquivos
          - NÃO invente funcionalidades
          - Baseie-se SOMENTE no diff enviado
          - O campo "description" deve conter markdown válido
          - O título DEVE ter no máximo 65 caracteres
          - O título NÃO pode ser truncado
          - O JSON deve ser válido
          - Retorne APENAS JSON

          FORMATO:
          {
            "description": "# Descrição da Pull Request\n\n## Resumo Técnico\n[TEXTO PREENCHIDO PELA IA]\n\n## Arquivos Alterados\n\n### Arquivos Criados\n- [ARQUIVO E DESCRIÇÃO REAL]\n\n### Arquivos Modificados\n- [ARQUIVO E DESCRIÇÃO REAL]\n\n### Arquivos Deletados\n- [ARQUIVO E MOTIVO]\n\n## O Que Foi Alterado\n- [ALTERAÇÃO REAL 1]\n- [ALTERAÇÃO REAL 2]\n\n## Impactos\n\n### Performance\n- [IMPACTO REAL]\n\n### Segurança\n- [IMPACTO REAL]\n\n### Compatibilidade\n- Compatível com versões anteriores: Sim/Não\n- Requer migration: Sim/Não\n\n## Como Testar\n1. [PASSO REAL]\n2. [PASSO REAL]\n3. [RESULTADO ESPERADO]"
          }

          EOF
          )

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "mistralai/mistral-nemotron",
              response_format: {
                type: "json_object"
              },
              messages: [
                {
                  role: "system",
                  content: "Retorne somente JSON válido."
                },
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.05,
              top_p: 0.7,
              max_tokens: 2000
            }')


            RESPONSE=""

            for i in 1 2 3; do

              echo "🔄 Tentativa descrição: $i"

              RESPONSE=$(curl -s https://integrate.api.nvidia.com/v1/chat/completions \
                -H "Authorization: Bearer $NVIDIA_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$REQUEST_BODY")

              echo "$RESPONSE"

              if echo "$RESPONSE" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
                echo "✅ Resposta válida recebida"
                break
              fi

              ERROR_DETAIL=$(echo "$RESPONSE" | jq -r '.detail // empty')

              echo "⚠️ Erro detectado: $ERROR_DETAIL"

              sleep 5

            done

          echo "🔍 Debug descrição:"
          echo "$RESPONSE"

          AI_CONTENT=$(echo "$RESPONSE" \
            | jq -r '.choices[0].message.content // empty' 2>/dev/null)

          if [ -z "$AI_CONTENT" ]; then

            echo "⚠️ IA falhou. Usando fallback."

            BODY="## 📋 PR Automática

          Branch: \`${{ github.ref_name }}\`

          Alterações detectadas automaticamente."

          else

            CLEAN_CONTENT=$(echo "$AI_CONTENT" \
              | sed 's/^```json//g' \
              | sed 's/^```//g' \
              | sed 's/```$//g')

            if echo "$CLEAN_CONTENT" | jq empty 2>/dev/null; then
              AI_JSON="$CLEAN_CONTENT"
            else
              AI_JSON="{}"
            fi

            BODY=$(echo "$AI_JSON" \
              | jq -r '.description // empty' 2>/dev/null)

            if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then

              BODY="## 📋 Alterações Detectadas

          Branch: \`${{ github.ref_name }}\`"
            fi
          fi


          echo "title=$TITLE" >> $GITHUB_OUTPUT

          DELIMITER=$(openssl rand -hex 8)

          {
            echo "body<<$DELIMITER"
            echo "$BODY"
            echo "$DELIMITER"
          } >> $GITHUB_OUTPUT

          echo "✅ Finalizado com sucesso"

      - name: 🚀 CREATE OR UPDATE PULL REQUEST
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          TITLE="${{ steps.ai.outputs.title }}"
          BODY=$(cat <<'EOF'
          ${{ steps.ai.outputs.body }}
          EOF
          )

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then

            echo "🚀 Criando Pull Request..."

            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"

            echo "✅ PR criada com sucesso!"

          else

            echo "🔄 Atualizando Pull Request #$PR_NUMBER..."

            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body "$BODY"

            echo "✅ PR atualizada com sucesso!"
          fi

      - name: ⏭️ SKIP - NO DIFF
        if: env.HAS_DIFF == 'false'
        run: |
          echo "⏭️ Sem alterações para gerar PR."