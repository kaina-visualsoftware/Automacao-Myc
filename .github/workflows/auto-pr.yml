name: AUTO AI PR

on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-latest

    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: INSTALL JQ
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: CHECK FOR COMMITS
        id: check
        run: |
          git fetch origin develop
          
          # Verifica se há commits diferentes entre develop e a branch atual
          COMMITS_COUNT=$(git rev-list --count origin/develop..HEAD)
          echo "COMMITS COUNT: $COMMITS_COUNT"
          
          if [ "$COMMITS_COUNT" -eq "0" ]; then
            echo "⚠️ Nenhum commit diferente entre develop e HEAD"
            echo "has_commits=false" >> $GITHUB_OUTPUT
            echo "diff=" >> $GITHUB_OUTPUT
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
            
            # Pega o diff apenas dos commits novos
            DIFF=$(git diff origin/develop...HEAD | head -c 15000)
            
            # Escapa para JSON
            DIFF_ESCAPED=$(printf '%s' "$DIFF" | jq -Rs .)
            echo "diff=$DIFF_ESCAPED" >> $GITHUB_OUTPUT
          fi

      - name: GENERATE AI DESCRIPTION
        id: ai
        if: steps.check.outputs.has_commits == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DIFF_CONTENT="${{ steps.check.outputs.diff }}"
          
          # Se diff estiver vazio, usa mensagem padrão
          if [ -z "$DIFF_CONTENT" ] || [ "$DIFF_CONTENT" = '""' ]; then
            echo "⚠️ Diff vazio, usando descrição padrão"
            echo "body=## 📝 Alterações realizadas\n\nPR criado automaticamente para a branch ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=PR Automático: ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📊 Enviando diff para IA (tamanho: ${#DIFF_CONTENT} caracteres)"
          
          # Criar prompt mais estruturado
          cat > request.json <<EOF
          {
            "model": "openai/gpt-4.1-mini",
            "messages": [
              {
                "role": "system",
                "content": "Você é um engenheiro de software especialista em gerar descrições de Pull Request. Gere uma descrição clara, profissional e em português. Use markdown."
              },
              {
                "role": "user",
                "content": "Gere uma descrição de Pull Request para as seguintes alterações (diff):"
              },
              {
                "role": "user",
                "content": ${DIFF_CONTENT}
              }
            ],
            "temperature": 0.3,
            "max_tokens": 1000
          }
          EOF
          
          # Log para debug (sem expor a chave)
          echo "🔄 Chamando API OpenRouter..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json)
          
          # Separar resposta do código HTTP
          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          
          echo "📡 HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Erro na API: $HTTP_BODY"
            echo "body=## ⚠️ Descrição não gerada automaticamente\n\n**Branch:** ${{ github.ref_name }}\n\n**Alterações:** Verifique os commits para mais detalhes." >> $GITHUB_OUTPUT
            echo "title=PR: ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Extrair resposta
          BODY=$(echo "$HTTP_BODY" | jq -r '.choices[0].message.content // empty')
          
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "⚠️ Resposta vazia da IA"
            BODY="## 📝 Alterações realizadas\n\nPR criado automaticamente para a branch ${{ github.ref_name }}"
            TITLE="PR Automático: ${{ github.ref_name }}"
          else
            # Extrair título da primeira linha não vazia que não seja header markdown
            TITLE=$(echo "$BODY" | grep -v '^#' | grep -v '^$' | head -n 1 | cut -c1-80)
            if [ -z "$TITLE" ]; then
              TITLE="PR: ${{ github.ref_name }}"
            fi
          fi
          
          echo "✅ Descrição gerada com sucesso"
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          
          # Salvar body com escaping
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: CREATE OR UPDATE PR
        if: steps.check.outputs.has_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          
          # Verificar PR existente
          OPEN_PR=$(gh pr list \
            --head "$BRANCH" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number')
          
          if [ -z "$OPEN_PR" ] || [ "$OPEN_PR" = "null" ]; then
            echo "📝 CRIANDO NOVO PR..."
            
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "${{ steps.ai.outputs.title }}" \
              --body "${{ steps.ai.outputs.body }}"
              
            echo "✅ PR criado com sucesso!"
          else
            echo "🔄 PR #$OPEN_PR já existe - atualizando descrição"
            
            gh pr edit "$OPEN_PR" \
              --title "${{ steps.ai.outputs.title }}" \
              --body "${{ steps.ai.outputs.body }}"
              
            echo "✅ PR atualizado com nova descrição!"
          fi
      
      - name: SEM COMMITS - SKIP
        if: steps.check.outputs.has_commits == 'false'
        run: |
          echo "⚠️ Nenhum commit novo para criar PR"
          echo "Branch ${{ github.ref_name }} está sincronizada com develop"