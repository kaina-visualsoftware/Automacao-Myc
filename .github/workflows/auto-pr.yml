name: AUTO AI PR

on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-latest

    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: INSTALL JQ
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: GET GIT DIFF
        id: diff
        run: |
          git fetch origin develop

          DIFF=$(git diff origin/develop...HEAD | head -c 12000)

          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: GENERATE AI DESCRIPTION
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |

          DIFF_CONTENT=$(printf '%s\n' "${{ steps.diff.outputs.diff }}" | jq -Rs .)

          cat > request.json <<EOF
          {
            "model": "openai/gpt-4.1-mini",
            "messages": [
              {
                "role": "system",
                "content": "Você gera descrições profissionais de pull request."
              },
              {
                "role": "user",
                "content": "Analise estas alterações e gere uma descrição markdown:"
              },
              {
                "role": "user",
                "content": $DIFF_CONTENT
              }
            ],
            "temperature": 0.3
          }
          EOF

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json)

          echo "$RESPONSE"

          BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          if [ "$BODY" = "null" ] || [ -z "$BODY" ]; then
            BODY="PR CRIADO AUTOMATICAMENTE"
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: CREATE PR IF CLOSED
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          BRANCH="${{ github.ref_name }}"

          OPEN_PR=$(gh pr list \
            --head "$BRANCH" \
            --base develop \
            --state open \
            --json number \
            --jq 'length')

          echo "OPEN PRS: $OPEN_PR"

          if [ "$OPEN_PR" -eq "0" ]; then

            echo "CRIANDO NOVO PR..."

            TITLE=$(echo "${{ steps.ai.outputs.body }}" | head -n 1 | sed 's/^#* //')

            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "${{ steps.ai.outputs.body }}"

          else

            echo "PR JA EXISTE - APENAS ATUALIZANDO COMMITS"

          fi
