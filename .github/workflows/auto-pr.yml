name: AUTO AI PR

on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH DEVELOP
        run: |
          git fetch origin develop --update-head-ok
          git fetch origin ${{ github.ref_name }}

      - name: 🔍 GET GIT DIFF
        run: |
          echo "Branch atual: ${{ github.ref_name }}"
          
          # Pega o diff entre develop e a branch atual
          git diff origin/develop...HEAD --no-color > diff.txt
          
          # Conta linhas para verificar se tem alterações
          DIFF_LINES=$(wc -l < diff.txt)
          
          if [ "$DIFF_LINES" -eq 0 ]; then
            echo "HAS_DIFF=false" >> $GITHUB_ENV
            echo "⚠️ Nenhuma alteração detectada."
          else
            echo "HAS_DIFF=true" >> $GITHUB_ENV
            echo "✅ Alterações encontradas ($DIFF_LINES linhas)"
          fi

      - name: 📝 GET GIT LOG
        if: env.HAS_DIFF == 'true'
        run: |
          # Pega todos os commits da branch em relação ao develop
          git log origin/develop...HEAD --pretty=format:"%h - %s" > commits.txt
          
          echo "📋 Commits encontrados:"
          cat commits.txt

      - name: 📂 ANALYZE FILES CHANGED
        if: env.HAS_DIFF == 'true'
        run: |
          echo "🔍 Analisando arquivos alterados..."
          
          # Lista de arquivos criados, modificados e deletados
          git diff --name-status origin/develop...HEAD > files_status.txt
          
          # Separar por tipo
          echo "=== ARQUIVOS CRIADOS ===" > files_analysis.txt
          git diff --name-status origin/develop...HEAD | grep "^A" | cut -f2 >> files_analysis.txt
          
          echo -e "\n=== ARQUIVOS MODIFICADOS ===" >> files_analysis.txt
          git diff --name-status origin/develop...HEAD | grep "^M" | cut -f2 >> files_analysis.txt
          
          echo -e "\n=== ARQUIVOS DELETADOS ===" >> files_analysis.txt
          git diff --name-status origin/develop...HEAD | grep "^D" | cut -f2 >> files_analysis.txt
          
          # Conta alterações por arquivo
          echo -e "\n=== ESTATÍSTICAS ===" >> files_analysis.txt
          echo "Total de arquivos criados: $(git diff --name-status origin/develop...HEAD | grep "^A" | wc -l)" >> files_analysis.txt
          echo "Total de arquivos modificados: $(git diff --name-status origin/develop...HEAD | grep "^M" | wc -l)" >> files_analysis.txt
          echo "Total de arquivos deletados: $(git diff --name-status origin/develop...HEAD | grep "^D" | wc -l)" >> files_analysis.txt
          
          # Diff de linhas por arquivo
          echo -e "\n=== ALTERAÇÕES POR ARQUIVO ===" >> files_analysis.txt
          git diff --stat origin/develop...HEAD >> files_analysis.txt
          
          echo "✅ Análise de arquivos concluída"
          cat files_analysis.txt

      - name: 📊 GET FILE CONTENT SUMMARY
        if: env.HAS_DIFF == 'true'
        run: |
          echo "📄 Gerando resumo de conteúdo dos arquivos..."
          
          # Para cada arquivo criado, pega as primeiras 500 linhas
          > file_contents_summary.txt
          
          echo "=== RESUMO DE ARQUIVOS CRIADOS ===" >> file_contents_summary.txt
          git diff --name-status origin/develop...HEAD | grep "^A" | cut -f2 | while read file; do
            echo "" >> file_contents_summary.txt
            echo "FILE: $file" >> file_contents_summary.txt
            echo "---" >> file_contents_summary.txt
            git show HEAD:"$file" 2>/dev/null | head -100 >> file_contents_summary.txt
            echo "" >> file_contents_summary.txt
          done
          
          # Para arquivos modificados, pega o diff
          echo -e "\n=== RESUMO DE DIFF DOS ARQUIVOS PRINCIPAIS ===" >> file_contents_summary.txt
          git diff origin/develop...HEAD --no-color | head -2000 >> file_contents_summary.txt
          
          wc -l < file_contents_summary.txt

      - name: 🤖 GENERATE AI DESCRIPTION
        id: ai
        if: env.HAS_DIFF == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          echo "🤖 Gerando descrição detalhada com NVIDIA AI..."

          # Combina todas as informações
          COMMITS_CONTENT=$(cat commits.txt)
          FILES_ANALYSIS=$(cat files_analysis.txt)

          echo "📝 Gerando título da PR..."

          TITLE_PROMPT="Gere apenas um título profissional para Pull Request.
          REGRAS:
          - Máximo 65 caracteres
          - Não ultrapasse 65 caracteres
          - Não use aspas
          - Não use markdown
          - Não use emojis
          - Deve terminar em palavra completa
          - Responda apenas com o título
          - O título DEVE ter entre 45 e 65 caracteres.

          COMMITS:
          $COMMITS_CONTENT

          ARQUIVOS:
          $FILES_ANALYSIS"

          TITLE_REQUEST=$(jq -n \
          --arg prompt "$TITLE_PROMPT" \
          '{
            model: "mistralai/mistral-large-3-675b-instruct-2512",
            messages: [
              {
                role: "user",
                content: $prompt
              }
            ],
            temperature: 0.0,
            max_tokens: 80
          }')

          TITLE_RESPONSE=$(curl -s https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "🔍 Debug título:" >&2
          echo "$TITLE_RESPONSE" | jq . >&2 || true

          TITLE=$(echo "$TITLE_RESPONSE" | jq -r '.choices[0].message.content // empty')

          TITLE=$(echo "$TITLE" \
            | tr -d '\n\r' \
            | sed 's/["`]//g' \
            | sed 's/[[:space:]]*$//')

          if [ -z "$TITLE" ] || [ ${#TITLE} -gt 65 ]; then
            echo "⚠️ Título inválido. Usando fallback."

            TITLE="feat: ${{ github.ref_name }}"
          fi

          echo "✅ Título gerado: $TITLE"


          # Remove possíveis caracteres binários/null bytes
          FILE_CONTENTS=$(strings file_contents_summary.txt | head -c 4000)
          DIFF_CONTENT=$(strings diff.txt | head -c 6000)
          

          # Cria um prompt muito mais detalhado
          read -r -d '' PROMPT << 'EOF' || true
          Você é um engenheiro especialista em análise de código e Pull Requests profissionais em português.

          ## INFORMAÇÕES DA PULL REQUEST

          ### COMMITS REALIZADOS:
          ${COMMITS_CONTENT}

          ### ANÁLISE DE ARQUIVOS:
          ${FILES_ANALYSIS}

          ### AMOSTRA DE CONTEÚDO DOS ARQUIVOS:
          ${FILE_CONTENTS}

          ### DIFF DO CÓDIGO:
          ${DIFF_CONTENT}

          ## INSTRUÇÃO

          Analise os commits, arquivos alterados e diff enviados.

          Gere APENAS um JSON válido.

          REGRAS OBRIGATÓRIAS:
          - NÃO copie placeholders do exemplo
          - NÃO escreva textos genéricos
          - NÃO use frases como:
            "Descreva o que mudou"
            "Passo 1 para testar"
            "Texto aqui"
          - TODAS as seções DEVEM ser preenchidas com conteúdo real
          - Se não houver conteúdo para uma seção, remova a seção
          - NÃO invente arquivos
          - NÃO invente funcionalidades
          - Baseie-se SOMENTE no diff enviado
          - O campo "description" deve conter markdown válido
          - O título DEVE ter no máximo 65 caracteres
          - O título NÃO pode ser truncado
          - O JSON deve ser válido
          - Retorne APENAS JSON

          FORMATO:
          {
            "description": "# Descrição da Pull Request\n\n## Resumo Técnico\n[TEXTO PREENCHIDO PELA IA]\n\n## Arquivos Alterados\n\n### Arquivos Criados\n- [ARQUIVO E DESCRIÇÃO REAL]\n\n### Arquivos Modificados\n- [ARQUIVO E DESCRIÇÃO REAL]\n\n### Arquivos Deletados\n- [ARQUIVO E MOTIVO]\n\n## O Que Foi Alterado\n- [ALTERAÇÃO REAL 1]\n- [ALTERAÇÃO REAL 2]\n\n## Impactos\n\n### Performance\n- [IMPACTO REAL]\n\n### Segurança\n- [IMPACTO REAL]\n\n### Compatibilidade\n- Compatível com versões anteriores: Sim/Não\n- Requer migration: Sim/Não\n\n## Como Testar\n1. [PASSO REAL]\n2. [PASSO REAL]\n3. [RESULTADO ESPERADO]"
          }

          EOF

          # Substitui as variáveis no prompt
          PROMPT=$(eval "echo \"$PROMPT\"")


          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              "model": "mistralai/mistral-nemotron",

              response_format: {
                type: "json_object"
              },

              messages: [
                {
                  role: "system",
                  content: "Retorne APENAS um JSON válido contendo SOMENTE o campo 'description'. Nunca retorne 'title'. Nunca explique nada fora do JSON."
                },
                {
                  role: "user",
                  content: $prompt
                }
              ],

              temperature: 0.05,
              top_p: 0.7,
              max_tokens: 2000
            }')

          echo "📤 Enviando requisição para NVIDIA AI..."

          RESPONSE=$(curl -s https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "🔍 Debug - Response recebida:" >&2
          echo "$RESPONSE" | jq . >&2 || true


          AI_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$AI_CONTENT" ]; then
            echo "❌ Erro ao chamar NVIDIA AI. Usando fallback."

            TITLE="feat: Alterações em ${{ github.ref_name }}"

            BODY="## 📋 PR Automática

          Branch: \`${{ github.ref_name }}\`

          Alterações detectadas. Descrição gerada automaticamente."

          else
            echo "📄 Conteúdo bruto da IA:" >&2
            echo "$AI_CONTENT" >&2

            CLEAN_CONTENT=$(echo "$AI_CONTENT" \
              | sed 's/^```json//g' \
              | sed 's/^```//g' \
              | sed 's/```$//g')

            if echo "$CLEAN_CONTENT" | jq empty 2>/dev/null; then
              echo "✅ JSON válido recebido"

              AI_JSON="$CLEAN_CONTENT"
            else
              echo "⚠️ JSON inválido. Tentando extrair..."

              AI_JSON=$(echo "$CLEAN_CONTENT" \
                | sed -n '/{/,$p' \
                | sed -n '/}/q;p' \
                | jq . 2>/dev/null || echo '{}')
            fi

            BODY=$(echo "$AI_JSON" | jq -r '.description // empty' 2>/dev/null)

            if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
              echo "⚠️ Não conseguiu extrair título"

              TITLE="feat: ${{ github.ref_name }}"
            fi

            if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
              echo "⚠️ Não conseguiu extrair descrição"

              BODY="## 📋 Alterações Detectadas

          Branch: \`${{ github.ref_name }}\`"
            fi
          fi


          TITLE=$(echo "$TITLE" \
            | sed 's/["`'\'']//g' \
            | cut -c1-65 \
            | sed 's/[[:space:]]*$//')


          if [ -z "$TITLE" ] || [ ${#TITLE} -lt 5 ]; then
            TITLE="feat: ${{ github.ref_name }}"
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "✅ Título gerado: $TITLE"
          echo "✅ Descrição gerada com sucesso"

      - name: 🚀 CREATE OR UPDATE PULL REQUEST
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          TITLE="${{ steps.ai.outputs.title }}"
          BODY=$(cat <<'EOF'
          ${{ steps.ai.outputs.body }}
          EOF
          )

          # Busca PR existente
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "🚀 Criando nova Pull Request..."
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
            echo "✅ PR criada com sucesso!"
          else
            echo "🔄 Atualizando Pull Request #$PR_NUMBER..."
            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body "$BODY"
            echo "✅ PR atualizada com sucesso!"
          fi

      - name: ⏭️ SKIP - NO DIFF
        if: env.HAS_DIFF == 'false'
        run: echo "⏭️ Sem alterações para gerar PR. Nenhuma ação realizada."