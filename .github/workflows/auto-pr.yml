name: AUTO AI PR

on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: FETCH DEVELOP
        run: git fetch origin develop:develop --update-head-ok

      - name: GET GIT DIFF
        run: |
          echo "🔍 Branch atual: ${{ github.ref_name }}"
          git diff develop..HEAD --no-color | head -c 20000 > diff.txt
          
          if [ ! -s diff.txt ]; then
            echo "HAS_DIFF=false" >> $GITHUB_ENV
            echo "⚠️ Nenhuma alteração detectada."
          else
            echo "HAS_DIFF=true" >> $GITHUB_ENV
            echo "✅ Alterações encontradas ($(wc -l < diff.txt) linhas)"
          fi

      - name: GENERATE AI DESCRIPTION
        id: ai
        if: env.HAS_DIFF == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🤖 Gerando descrição com IA..."

          DIFF_CONTENT=$(cat diff.txt)

          PROMPT=$(cat <<EOF
          Analise o diff abaixo e gere:

          1. Um TITULO CURTO com no máximo 60 caracteres.
          2. Uma DESCRIÇÃO COMPLETA em markdown.

          RETORNE EXATAMENTE neste formato:

          TITLE: Título claro e objetivo
          BODY:
          # Descrição da Pull Request
          EOF
          )

          # Chamada da API (mantida limpa)
          jq -n --arg model "openai/gpt-4.1-mini" --arg prompt "$PROMPT" '{
            model: $model,
            messages: [{role: "system", content: "Você é um engenheiro especialista em Pull Requests profissionais em português."},
                       {role: "user", content: $prompt}],
            temperature: 0.3,
            max_tokens: 1200
          }' > request.json

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json)

          AI_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$AI_CONTENT" ] || [ "$AI_CONTENT" = "null" ]; then
            TITLE="Atualização em ${{ github.ref_name }}"
            BODY="## PR Automática\n\nBranch: ${{ github.ref_name }}"
          else
            TITLE=$(echo "$AI_CONTENT" | grep "^TITLE:" | head -n1 | sed 's/^TITLE:[[:space:]]*//')
            BODY=$(echo "$AI_CONTENT" | sed -n '/^BODY:/,$p' | sed '1d')
          fi

          # Força limite rigoroso de caracteres
          TITLE=$(echo "$TITLE" | sed 's/["`'\'']//g' | tr -d '\n' | cut -c1-75 | sed 's/[[:space:]]*$//')

          if [ -z "$TITLE" ] || [ ${#TITLE} -lt 5 ]; then
            TITLE="PR: ${{ github.ref_name }}"
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "✅ Título gerado: $TITLE"

      - name: CREATE OR UPDATE PULL REQUEST
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          TITLE="${{ steps.ai.outputs.title }}"
          BODY_FILE="pr_body.md"

          echo '${{ steps.ai.outputs.body }}' > "$BODY_FILE"

          # Busca PR existente
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "🚀 Criando nova Pull Request..."
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$BODY_FILE"
          else
            echo "🔄 Atualizando Pull Request #$PR_NUMBER..."
            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body-file "$BODY_FILE"
          fi

      - name: SKIP - NO DIFF
        if: env.HAS_DIFF == 'false'
        run: echo "⏭️ Sem alterações para gerar PR."