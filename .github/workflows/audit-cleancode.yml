name: CLEAN CODE & TECH DEBT AUDITOR

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit-cleancode:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH HISTORY
        run: git fetch --all

      - name: 📂 SCAN ALL CODE FILES
        run: |
          echo "🔍 Escaneando arquivos de código..."
          find . \
            -type f \
            \( -name "*.robot" -o -name "*.resource" -o -name "*.py" \
               -o -name "*.js" -o -name "*.ts" \) \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" \
            > code_files.txt
          
          echo "✅ Arquivos de código encontrados:"
          wc -l code_files.txt

      - name: 📄 BUILD CLEANCODE CONTEXT
        run: |
          > cleancode_context.txt
          echo "===== ESTRUTURA DE CÓDIGO =====" >> cleancode_context.txt
          cat code_files.txt | head -40 >> cleancode_context.txt
          
          echo "" >> cleancode_context.txt
          echo "===== AMOSTRA DE ARQUIVOS IMPORTANTES =====" >> cleancode_context.txt
          
          head -15 code_files.txt | while read file; do
            echo "" >> cleancode_context.txt
            echo "FILE: $file" >> cleancode_context.txt
            echo "----------------------------------------" >> cleancode_context.txt
            head -90 "$file" >> cleancode_context.txt 2>/dev/null || true
            echo "... (truncado)" >> cleancode_context.txt
          done
          
          echo "" >> cleancode_context.txt
          echo "===== ÚLTIMOS COMMITS =====" >> cleancode_context.txt
          git log -12 --pretty=format:"%h - %an - %s" >> cleancode_context.txt
          
          echo "✅ Contexto Clean Code gerado ($(wc -c < cleancode_context.txt) bytes)"

      - name: 🤖 AI CLEANCODE AUDIT
        id: ai_cleancode_audit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🤖 Executando auditoria Clean Code..."
          PROJECT_CONTEXT=$(head -c 55000 cleancode_context.txt)

          PROMPT=$(cat <<EOF
          Você é um DEFENSOR MUNDIAL DE CLEAN CODE, ESPECIALISTA EM DÍVIDA TÉCNICA e REVISOR DE CÓDIGO SÊNIOR.
          Sua única missão é realizar uma AUDITORIA PROFUNDA DE CLEAN CODE E DÍVIDA TÉCNICA no projeto abaixo.
          Você possui 20+ anos de experiência com:
          - Princípios de Clean Code (Robert C. Martin)
          - Princípios SOLID
          - Princípios DRY, KISS e YAGNI
          - Padrões de refatoração (Martin Fowler)
          - Identificação e eliminação de code smells
          - Quantificação e priorização de dívida técnica
          - Convenções de nomenclatura e legibilidade de código
          - Redução de complexidade cognitiva
          - Métricas de manutenibilidade de código
          - Padrões de design aplicados à automação de testes
          - Boas práticas de revisão de código em escala enterprise

          ========================
          SEU FRAMEWORK DE AUDITORIA DE CLEAN CODE
          ========================

          CAMADA 1 — NOMENCLATURA
          - Os nomes de funções/keywords revelam a intenção?
          - Os nomes são pronunciáveis e pesquisáveis?
          - Os nomes evitam mapeamento mental? (i vs index)
          - Nomes booleanos usam prefixos is/has/should/can?
          - Os nomes são consistentes em todo o código?
          - Abreviações são evitadas?
          - Nomes de classes/resources usam substantivos?
          - Nomes de keywords/funções usam verbos fortes?
          - Existem nomes enganosos? (um nome que sugere comportamento errado)
          - Existem nomes genéricos demais? (data, info, manager, handler, util)

          CAMADA 2 — FUNÇÕES E KEYWORDS
          - Cada função/keyword faz UMA única coisa?
          - A função é pequena o suficiente? (mais de 20 linhas é alerta, mais de 50 é crítico)
          - A função opera em UM único nível de abstração?
          - Existem parâmetros em excesso? (mais de 3 é alerta, mais de 5 é crítico)
          - Existem parâmetros de saída? (anti-pattern — use valores de retorno)
          - Existem parâmetros flag/booleanos que dividem o comportamento?
          - Existe código morto? (código que nunca é executado)
          - Existem blocos de código comentados?
          - Existem comentários TODO/FIXME/HACK que se tornaram permanentes?
          - A função é livre de efeitos colaterais onde deveria ser?

          CAMADA 3 — VIOLAÇÕES DE DRY (Don't Repeat Yourself)
          - Existem blocos de código duplicados? (exatos ou quase idênticos)
          - Existem padrões de lógica duplicados com nomes de variáveis diferentes?
          - Existem sequências de setup/teardown duplicadas?
          - Existem implementações de keywords copiadas e coladas?
          - Existem números mágicos repetidos entre arquivos?
          - Existem literais de string repetidas que deveriam ser constantes?
          - Existem padrões condicionais repetidos que deveriam ser extraídos?

          CAMADA 4 — COMPLEXIDADE DO CÓDIGO
          - Existem condicionais profundamente aninhados? (mais de 3 níveis é crítico)
          - Existem longas cadeias condicionais que deveriam usar padrões de design?
          - Existem expressões booleanas complexas que deveriam ser extraídas?
          - Existem blocos switch/case que deveriam usar polimorfismo?
          - A complexidade ciclomática está alta demais?
          - Existem funções com responsabilidades demais?

          CAMADA 5 — COMENTÁRIOS E DOCUMENTAÇÃO
          - Existem comentários explicando O QUÊ em vez do PORQUÊ?
          - Existem comentários obsoletos que não correspondem mais ao código?
          - Existem blocos de código comentados?
          - Existem comentários enganosos?
          - Existem funções sem documentação que precisam dela?
          - Está faltando a seção [Documentation] em keywords do Robot Framework?
          - Algoritmos complexos estão devidamente explicados?

          CAMADA 6 — TRATAMENTO DE ERROS
          - Os erros estão sendo silenciosamente ignorados? (blocos except/catch vazios)
          - As mensagens de erro são significativas e orientadas à ação?
          - Existem cenários de erro ausentes?
          - O tratamento de erros é consistente em todo o código?
          - Existem capturas genéricas de exceção ocultando erros reais?

          CAMADA 7 — INDICADORES DE DÍVIDA TÉCNICA
          - Código que não foi alterado há mais de 6 meses mas é crítico
          - Workarounds marcados como temporários que se tornaram permanentes
          - Abstrações ausentes que causam acoplamento excessivo
          - Soluções superengenheiradas para problemas simples (violação de YAGNI)
          - Soluções subengenheiradas criando fragilidade (violação de KISS)
          - Testes ausentes para caminhos críticos
          - Código que exige alteração em 10+ arquivos para uma única funcionalidade

          CAMADA 8 — CODE SMELLS (Catálogo de Martin Fowler aplicado ao código de testes)
          - "Bloater" — código que cresceu além do razoável
          - "Feature Envy" — código que usa dados de outro arquivo mais do que os próprios
          - "Data Clumps" — grupos de dados que sempre aparecem juntos
          - "Primitive Obsession" — uso de primitivos em vez de abstrações
          - "Switch Statements" — condicionais repetidos que deveriam ser polimórficos
          - "Parallel Inheritance Hierarchies" — estruturas paralelas redundantes
          - "Lazy Class" — classe/resource que faz pouco demais para justificar sua existência
          - "Speculative Generality" — sobre-abstração para um futuro que nunca chega
          - "Temporary Field" — variáveis definidas apenas em certas condições
          - "Message Chains" — longas cadeias de chamadas de métodos
          - "Middle Man" — função que apenas delega para outra
          - "Inappropriate Intimacy" — dois arquivos que sabem demais um sobre o outro
          - "Data Class" — resource com apenas dados e sem comportamento
          - "Refused Bequest" — herança de coisas que não são necessárias

          ========================
          PONTUAÇÃO DE DÍVIDA TÉCNICA
          ========================

          Para cada problema encontrado, estime:
          - Tipo de Dívida: Code Smell / Dívida de Design / Dívida de Testes / Dívida de Documentação
          - Idade da Dívida: Nova / Estabelecida / Legada
          - Custo da Dívida (tempo para corrigir): Minutos / Horas / Dias / Semanas
          - Taxa de Juros: O quanto piora com o tempo se não for corrigida

          ========================
          FORMATO DE RETORNO
          ========================

          RETORNE APENAS JSON VÁLIDO. SEM MARKDOWN. SEM TEXTO ADICIONAL.

          {
            "issues": [
              {
                "title": "Título claro do problema de Clean Code",
                "priority": "Alta",
                "severity": "Alta",
                "category": "Clean Code",
                "files": ["caminho/para/arquivo.robot"],
                "code_smell": "Qual code smell ou violação de Clean Code foi identificado",
                "solid_principle_violated": "Qual princípio SOLID foi violado, se aplicável",
                "clean_code_rule": "Qual regra de Clean Code está sendo violada",
                "debt_type": "Code Smell / Dívida de Design / Dívida de Testes",
                "debt_cost": "Horas/Dias para corrigir",
                "debt_interest": "Como piora com o tempo se não for corrigida",
                "problem": "Descrição extremamente detalhada do problema de Clean Code",
                "technical_impact": "Impacto na manutenibilidade e legibilidade do código",
                "business_impact": "Impacto na velocidade do time e no onboarding",
                "risk": "Risco caso a dívida técnica não seja paga",
                "reproduction": "Como identificar este problema no código",
                "current_code": "O código atual problemático exato",
                "refactored_code": "A versão limpa e refatorada do código",
                "refactoring_pattern": "Qual padrão de refatoração aplicar",
                "naming_improvements": "Melhorias específicas de nomenclatura",
                "extraction_suggestions": "O que deve ser extraído como funções/keywords",
                "suggestion": "Correção detalhada",
                "benefits": "Melhorias esperadas na qualidade do código",
                "readability_gain": "Estimativa de melhoria de legibilidade",
                "maintainability_gain": "Estimativa de melhoria de manutenibilidade",
                "complexity": "Baixa",
                "improvement_type": "Clean Code"
              }
            ]
          }

          PROJECT CONTEXT:
          $PROJECT_CONTEXT
          EOF
          )

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT$PROJECT_CONTEXT" \
            '{
              model: "openrouter/free",
              messages: [{ role: "user", content: $prompt }],
              temperature: 0.1,
              max_tokens: 2500,
              response_format: { "type": "json_object" }
            }')

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "$RESPONSE" > response.json

          AI_CONTENT=$(jq -r '.choices[0].message.content // empty' response.json)

          if [ -z "$AI_CONTENT" ]; then
            echo "❌ IA não retornou conteúdo"
            cat response.json
            exit 1
          fi

          echo "$AI_CONTENT" > ai_raw.txt

          cat ai_raw.txt | jq . > ai_issues.json 2>/dev/null || \
          python3 -c '
          import sys, json, re
          text = sys.stdin.read()
          match = re.search(r"\{[\s\S]*\}", text)
          if match:
              try:
                  data = json.loads(match.group(0))
                  print(json.dumps(data, ensure_ascii=False))
              except:
                  print("{\"issues\": []}")
          else:
              print("{\"issues\": []}")
          ' < ai_raw.txt > ai_issues.json 2>/dev/null || echo '{"issues": []}' > ai_issues.json

          echo "✅ JSON gerado com $(jq '.issues | length' ai_issues.json 2>/dev/null || echo 0) issues"

      - name: 🐞 CREATE CLEANCODE ISSUES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(jq '.issues | length' ai_issues.json 2>/dev/null || echo 0)
          [ "$TOTAL" -eq 0 ] && echo "⚠️ Nenhuma issue de Clean Code encontrada" && exit 0

          sanitize() { echo "$1" | sed 's/\r//g'; }

          create_label_if_not_exists() {
            local NAME="$1" COLOR="$2"
            EXISTS=$(gh label list --json name --jq ".[] | select(.name == \"$NAME\") | .name" 2>/dev/null)
            [ -z "$EXISTS" ] && gh label create "$NAME" --color "$COLOR" --description "AI Clean Code Audit" 2>/dev/null || true
          }

          create_label_if_not_exists "ai-cleancode-audit" "006B75"
          create_label_if_not_exists "tech-debt" "E4E669"
          create_label_if_not_exists "clean-code" "C2E0C6"
          create_label_if_not_exists "priority-critical" "B60205"
          create_label_if_not_exists "priority-high" "D93F0B"
          create_label_if_not_exists "priority-medium" "FBCA04"
          create_label_if_not_exists "priority-low" "0E8A16"

          jq -c '.issues[]' ai_issues.json | while read -r row; do
            TITLE=$(sanitize "$(echo "$row" | jq -r '.title // "Issue Clean Code"')")
            PRIORITY=$(sanitize "$(echo "$row" | jq -r '.priority // "Média"')")
            SEVERITY=$(sanitize "$(echo "$row" | jq -r '.severity // "Média"')")
            CATEGORY=$(sanitize "$(echo "$row" | jq -r '.category // "Clean Code"')")
            CODE_SMELL=$(sanitize "$(echo "$row" | jq -r '.code_smell // "Não identificado"')")
            SOLID_VIOLATED=$(sanitize "$(echo "$row" | jq -r '.solid_principle_violated // "Não aplicável"')")
            CLEAN_CODE_RULE=$(sanitize "$(echo "$row" | jq -r '.clean_code_rule // "Não informado"')")
            DEBT_TYPE=$(sanitize "$(echo "$row" | jq -r '.debt_type // "Não informado"')")
            DEBT_COST=$(sanitize "$(echo "$row" | jq -r '.debt_cost // "Não informado"')")
            DEBT_INTEREST=$(sanitize "$(echo "$row" | jq -r '.debt_interest // "Não informado"')")
            PROBLEM=$(sanitize "$(echo "$row" | jq -r '.problem // "Não informado"')")
            TECHNICAL_IMPACT=$(sanitize "$(echo "$row" | jq -r '.technical_impact // "Não informado"')")
            BUSINESS_IMPACT=$(sanitize "$(echo "$row" | jq -r '.business_impact // "Não informado"')")
            RISK=$(sanitize "$(echo "$row" | jq -r '.risk // "Não informado"')")
            REPRODUCTION=$(sanitize "$(echo "$row" | jq -r '.reproduction // "Não informado"')")
            CURRENT_CODE=$(sanitize "$(echo "$row" | jq -r '.current_code // "Não informado"')")
            REFACTORED_CODE=$(sanitize "$(echo "$row" | jq -r '.refactored_code // "Não informado"')")
            REFACTORING_PATTERN=$(sanitize "$(echo "$row" | jq -r '.refactoring_pattern // "Não informado"')")
            NAMING_IMPROVEMENTS=$(sanitize "$(echo "$row" | jq -r '.naming_improvements // "Não informado"')")
            EXTRACTION_SUGGESTIONS=$(sanitize "$(echo "$row" | jq -r '.extraction_suggestions // "Não informado"')")
            SUGGESTION=$(sanitize "$(echo "$row" | jq -r '.suggestion // "Não informado"')")
            BENEFITS=$(sanitize "$(echo "$row" | jq -r '.benefits // "Não informado"')")
            READABILITY_GAIN=$(sanitize "$(echo "$row" | jq -r '.readability_gain // "Não informado"')")
            MAINTAINABILITY_GAIN=$(sanitize "$(echo "$row" | jq -r '.maintainability_gain // "Não informado"')")
            COMPLEXITY=$(sanitize "$(echo "$row" | jq -r '.complexity // "Média"')")
            IMPROVEMENT_TYPE=$(sanitize "$(echo "$row" | jq -r '.improvement_type // "Clean Code"')")

            FILES_FORMATTED=""
            FILES_COUNT=$(echo "$row" | jq '.files | length' 2>/dev/null || echo "0")
            if [ "$FILES_COUNT" -gt 0 ]; then
              FILES_FORMATTED=$(echo "$row" | jq -r '.files[]' | while read -r f; do echo "- \`$f\`"; done)
            else
              FILES_FORMATTED="- Não identificado"
            fi

            BODY="
            ## 🧹 Categoria Clean Code & Tech Debt
            $CATEGORY — $IMPROVEMENT_TYPE

            ## 🔥 Prioridade | 🚨 Severidade
            $PRIORITY | $SEVERITY

            ---
            ## 📊 Dívida Técnica
            | Item                 | Valor                  |
            |----------------------|------------------------|
            | Tipo de Dívida       | $DEBT_TYPE             |
            | Custo Estimado       | $DEBT_COST             |
            | Taxa de Juros        | $DEBT_INTEREST         |

            ---
            ## 📂 Arquivos Afetados
            $FILES_FORMATTED

            ---
            ## 🦨 Code Smell / Violação
            $CODE_SMELL

            ---
            ## 📐 Princípio Violado
            $SOLID_VIOLATED

            ---
            ## 📝 Problema Identificado
            $PROBLEM

            ---
            ## 🔴 Código Atual
            \`\`\`robot
            $CURRENT_CODE
            \`\`\`

            ---
            ## ✅ Código Refatorado
            \`\`\`robot
            $REFACTORED_CODE
            \`\`\`

            ---
            ## 💡 Sugestão de Correção
            $SUGGESTION

            ---
            ## 🎯 Benefícios
            $BENEFITS

            > 🤖 Issue gerada automaticamente pelo **Clean Code & Tech Debt Auditor**
            "

            EXISTING=$(gh issue list --search "$TITLE in:title" --state all --json title --jq '.[0].title // empty' 2>/dev/null || echo "")

            if [ -n "$EXISTING" ]; then
              echo "⚠️ Issue já existe: $TITLE"
              continue
            fi

            LABELS="ai-cleancode-audit,clean-code,tech-debt"
            PRIORITY_SLUG=$(echo "$PRIORITY" | tr '[:upper:]' '[:lower:]')
            case "$PRIORITY_SLUG" in
              crítica|critica|critical) LABELS="$LABELS,priority-critical" ;;
              alta|high)                LABELS="$LABELS,priority-high" ;;
              média|media|medium)       LABELS="$LABELS,priority-medium" ;;
              baixa|low)                LABELS="$LABELS,priority-low" ;;
            esac

            echo "🚀 Criando issue Clean Code: $TITLE"
            gh issue create --title "$TITLE" --body "$BODY" --label "$LABELS"
            echo "✅ Issue criada: $TITLE"
            sleep 1
          done

          echo "✅ Auditoria Clean Code & Tech Debt finalizada"