name: TEST ARCHITECTURE AUDITOR

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH HISTORY
        run: git fetch --all

      - name: 📂 SCAN ALL FILES
        run: |
          find . \
            -type f \
            \( -name "*.robot" -o -name "*.resource" -o -name "*.py" \
               -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" \
               -o -name "*.md" \) \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" \
            > all_files.txt
          
          echo "✅ Total de arquivos encontrados:"
          wc -l all_files.txt

      - name: 📄 BUILD ARCHITECTURE CONTEXT
        run: |
          > arch_context.txt
          echo "===== ESTRUTURA DO PROJETO (Resumida) =====" >> arch_context.txt
          cat all_files.txt | head -40 >> arch_context.txt
          
          echo "" >> arch_context.txt
          echo "===== AMOSTRA DE ARQUIVOS IMPORTANTES =====" >> arch_context.txt
          
          # Apenas 15 arquivos + apenas primeiras linhas
          head -15 all_files.txt | while read file; do
            echo "" >> arch_context.txt
            echo "FILE: $file" >> arch_context.txt
            echo "----------------------------------------" >> arch_context.txt
            head -60 "$file" >> arch_context.txt 2>/dev/null || true
            echo "... (truncado)" >> arch_context.txt
          done
          
          echo "" >> arch_context.txt
          echo "===== ÚLTIMOS COMMITS =====" >> arch_context.txt
          git log -10 --pretty=format:"%h - %an - %s" >> arch_context.txt
          
          echo "✅ Contexto gerado ($(wc -c < arch_context.txt) bytes)"

      - name: 🤖 AI ARCHITECTURE AUDIT
        id: ai_arch_audit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROJECT_CONTEXT=$(head -c 65000 arch_context.txt)

          PROMPT=$(cat <<'EOF'
          Você é um ARQUITETO DE AUTOMAÇÃO DE TESTES DE NÍVEL MUNDIAL e ENGENHEIRO DE QUALIDADE ENTERPRISE.
          Sua única missão é realizar uma AUDITORIA ARQUITETURAL PROFUNDA no projeto de testes abaixo.
          Você possui 20+ anos de experiência com:
          - Arquitetura de automação de testes enterprise
          - Design e implementação da pirâmide de testes
          - Design de frameworks de automação escaláveis
          - Organização de testes orientada a domínio (Domain-Driven)
          - Princípios SOLID aplicados à automação de testes
          - Padrões de design em automação de testes (Page Object, Factory, Strategy, Builder)
          - Governança de automação multi-time e multi-projeto
          - Engenharia de plataforma de testes
          - Estratégias de testes para microsserviços
          - Arquitetura de testes de contrato (Contract Testing)
          - Arquitetura de gerenciamento de dados de teste
          - Observabilidade e monitoramento em automação de testes

          ========================
          SEU FRAMEWORK DE AUDITORIA ARQUITETURAL
          ========================

          CAMADA 1 — ESTRUTURA DO PROJETO
          - A estrutura de pastas reflete a separação por domínio/funcionalidade?
          - Existe uma separação clara entre: testes / keywords / recursos / dados / configuração?
          - Existe uma estratégia lógica de agrupamento? (por feature, por domínio, por camada)
          - Existem arquivos órfãos sem responsabilidade clara?
          - A convenção de nomenclatura das pastas é consistente?
          - A estrutura do projeto é escalável para 10x mais testes?
          - Existe um ponto de entrada claro / configuração do test runner?

          CAMADA 2 — SEPARAÇÃO DE CAMADAS
          - Existe uma separação clara entre: Camada de Testes / Camada de Negócio / Camada Técnica?
          - Interações de UI estão vazando para keywords de lógica de negócio?
          - Chamadas de API estão misturadas com passos de UI?
          - Existe uma abstração adequada entre os passos de teste e a implementação?
          - Os localizadores (locators) estão isolados em uma camada dedicada?
          - O gerenciamento de configuração está isolado?
          - O gerenciamento de dados de teste está isolado da lógica de testes?

          CAMADA 3 — REUSABILIDADE E COMPONENTIZAÇÃO
          - Os fluxos comuns estão devidamente extraídos como componentes reutilizáveis?
          - Existem fluxos duplicados entre diferentes arquivos de teste?
          - Existe uma camada de utilitários compartilhados?
          - Os fluxos de autenticação são reutilizados ou duplicados?
          - Existem builders / factories reutilizáveis de dados de teste?
          - Existe uma estratégia adequada de biblioteca compartilhada?

          CAMADA 4 — ESCALABILIDADE
          - A suíte consegue executar em paralelo sem conflitos?
          - Existe estado compartilhado que impediria a execução em paralelo?
          - Os recursos são thread-safe?
          - A arquitetura está preparada para testes multi-browser?
          - A arquitetura está preparada para execução em múltiplos ambientes?
          - Existe uma estratégia adequada de tags para execução seletiva?
          - Novas funcionalidades podem ser adicionadas sem alterar testes existentes?

          CAMADA 5 — MANUTENIBILIDADE
          - Quantos arquivos precisam ser alterados quando um elemento de UI muda?
          - Quantos arquivos precisam ser alterados quando uma URL muda?
          - Quantos arquivos precisam ser alterados quando um fluxo muda?
          - Existem gargalos arquiteturais que causam falhas em cascata?
          - Existe um único ponto de falha na arquitetura?
          - A configuração está centralizada ou espalhada pelo projeto?

          CAMADA 6 — ESTRATÉGIA DE DADOS DE TESTE
          - Os dados de teste estão hardcoded nos arquivos de teste?
          - Existe um padrão factory ou builder para dados de teste?
          - Os dados de teste são sensíveis ao ambiente de execução?
          - Dados sensíveis estão devidamente gerenciados? (não hardcoded)
          - Existe uma estratégia de limpeza de dados após os testes?
          - Existem dependências de dados entre os testes?

          CAMADA 7 — ANTI-PATTERNS
          - "Estrutura plana" — tudo em uma única pasta
          - "God resource" — um único arquivo fazendo tudo
          - "Testes acoplados" — testes que dependem uns dos outros
          - "Vazamento de ambiente" — configurações específicas de ambiente nos arquivos de teste
          - "Camadas de abstração ausentes" — testes acessando locators diretamente
          - "Dados hardcoded" — dados de teste embutidos na lógica dos testes
          - "Estado mutável compartilhado" — variáveis de suíte modificadas pelos testes
          - "Sem separação de responsabilidades" — testes misturando UI + API + BD

          ========================
          FORMATO DE RETORNO
          ========================

          RETORNE APENAS JSON VÁLIDO. SEM MARKDOWN. SEM TEXTO ADICIONAL.

          {
            "issues": [
              {
                "title": "Título claro do problema arquitetural",
                "priority": "Alta",
                "severity": "Alta",
                "category": "Arquitetura",
                "files": ["caminho/para/arquivo"],
                "architectural_layer": "Qual camada está afetada",
                "anti_pattern": "Qual anti-pattern arquitetural foi identificado",
                "problem": "Descrição extremamente detalhada do problema arquitetural encontrado",
                "technical_impact": "Impacto na escalabilidade e manutenibilidade",
                "business_impact": "Impacto na entrega e velocidade do time",
                "scalability_impact": "Como isso bloqueia o crescimento futuro",
                "maintenance_impact": "Quantos arquivos precisam mudar a cada correção",
                "risk": "Risco arquitetural caso não seja corrigido",
                "reproduction": "Como identificar este problema no código",
                "current_structure": "Descrição da estrutura atual problemática",
                "suggested_structure": "Organização ideal de pastas e arquivos",
                "suggested_layers": "Separação de camadas recomendada",
                "migration_strategy": "Como migrar da estrutura atual para a ideal",
                "suggestion": "Correção arquitetural detalhada",
                "benefits": "Benefícios arquiteturais esperados",
                "complexity": "Alta",
                "improvement_type": "Arquitetura"
              }
            ]
          }

          PROJECT CONTEXT:
          $PROJECT_CONTEXT
          EOF
          )

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT$PROJECT_CONTEXT" \
            '{
              model: "google/gemini-2.0-flash-exp:free",
              messages: [{ role: "user", content: $prompt }],
              temperature: 0.1,
              max_tokens: 2500,
              response_format: { "type": "json_object" }
            }')

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "$RESPONSE" > response.json

          AI_CONTENT=$(jq -r '.choices[0].message.content // empty' response.json)

          if [ -z "$AI_CONTENT" ]; then
            echo "❌ IA não retornou conteúdo"
            cat response.json
            exit 1
          fi

          echo "$AI_CONTENT" > ai_raw.txt

          cat ai_raw.txt | jq . > ai_issues.json 2>/dev/null || \
          python3 -c '
          import sys, json, re
          text = sys.stdin.read()
          match = re.search(r"\{[\s\S]*\}", text)
          if match:
              try:
                  data = json.loads(match.group(0))
                  print(json.dumps(data, ensure_ascii=False))
              except:
                  print("{\"issues\": []}")
          else:
              print("{\"issues\": []}")
          ' < ai_raw.txt > ai_issues.json 2>/dev/null || echo '{"issues": []}' > ai_issues.json

          echo "✅ JSON gerado com $(jq '.issues | length' ai_issues.json) issues"

      - name: 🐞 CREATE ARCHITECTURE ISSUES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(jq '.issues | length' ai_issues.json 2>/dev/null || echo 0)
          [ "$TOTAL" -eq 0 ] && echo "⚠️ Nenhuma issue de arquitetura encontrada" && exit 0

          sanitize() { echo "$1" | sed 's/\r//g'; }

          create_label_if_not_exists() {
            local NAME="$1" COLOR="$2"
            EXISTS=$(gh label list --json name --jq ".[] | select(.name == \"$NAME\") | .name" 2>/dev/null)
            [ -z "$EXISTS" ] && gh label create "$NAME" --color "$COLOR" --description "AI Architecture Audit" 2>/dev/null || true
          }

          create_label_if_not_exists "ai-arch-audit"      "8B00FF"
          create_label_if_not_exists "priority-critical"  "B60205"
          create_label_if_not_exists "priority-high"      "D93F0B"
          create_label_if_not_exists "priority-medium"    "FBCA04"
          create_label_if_not_exists "priority-low"       "0E8A16"
          create_label_if_not_exists "category-architecture" "1D76DB"

          jq -c '.issues[]' ai_issues.json | while read -r row; do

            TITLE=$(sanitize "$(echo "$row" | jq -r '.title // "Issue Arquitetura"')")
            PRIORITY=$(sanitize "$(echo "$row" | jq -r '.priority // "Média"')")
            SEVERITY=$(sanitize "$(echo "$row" | jq -r '.severity // "Média"')")
            CATEGORY=$(sanitize "$(echo "$row" | jq -r '.category // "Arquitetura"')")
            ARCH_LAYER=$(sanitize "$(echo "$row" | jq -r '.architectural_layer // "Não identificado"')")
            ANTI_PATTERN=$(sanitize "$(echo "$row" | jq -r '.anti_pattern // "Não identificado"')")
            PROBLEM=$(sanitize "$(echo "$row" | jq -r '.problem // "Não informado"')")
            TECHNICAL_IMPACT=$(sanitize "$(echo "$row" | jq -r '.technical_impact // "Não informado"')")
            BUSINESS_IMPACT=$(sanitize "$(echo "$row" | jq -r '.business_impact // "Não informado"')")
            SCALABILITY_IMPACT=$(sanitize "$(echo "$row" | jq -r '.scalability_impact // "Não informado"')")
            MAINTENANCE_IMPACT=$(sanitize "$(echo "$row" | jq -r '.maintenance_impact // "Não informado"')")
            RISK=$(sanitize "$(echo "$row" | jq -r '.risk // "Não informado"')")
            REPRODUCTION=$(sanitize "$(echo "$row" | jq -r '.reproduction // "Não informado"')")
            CURRENT_STRUCTURE=$(sanitize "$(echo "$row" | jq -r '.current_structure // "Não informado"')")
            SUGGESTED_STRUCTURE=$(sanitize "$(echo "$row" | jq -r '.suggested_structure // "Não informado"')")
            SUGGESTED_LAYERS=$(sanitize "$(echo "$row" | jq -r '.suggested_layers // "Não informado"')")
            MIGRATION_STRATEGY=$(sanitize "$(echo "$row" | jq -r '.migration_strategy // "Não informado"')")
            SUGGESTION=$(sanitize "$(echo "$row" | jq -r '.suggestion // "Não informado"')")
            BENEFITS=$(sanitize "$(echo "$row" | jq -r '.benefits // "Não informado"')")
            COMPLEXITY=$(sanitize "$(echo "$row" | jq -r '.complexity // "Não informado"')")
            IMPROVEMENT_TYPE=$(sanitize "$(echo "$row" | jq -r '.improvement_type // "Arquitetura"')")

            FILES_FORMATTED=""
            FILES_COUNT=$(echo "$row" | jq '.files | length' 2>/dev/null || echo "0")
            if [ "$FILES_COUNT" -gt 0 ]; then
              FILES_FORMATTED=$(echo "$row" | jq -r '.files[]' | while read -r f; do echo "- \`$f\`"; done)
            else
              FILES_FORMATTED="- Não identificado"
            fi

            BODY="
            ## 🏗️ Categoria Arquitetural
            $CATEGORY — $IMPROVEMENT_TYPE

            ## 🔥 Prioridade | 🚨 Severidade
            $PRIORITY | $SEVERITY

            ---

            ## 📂 Arquivos Afetados
            $FILES_FORMATTED

            ---

            ## 🗂️ Camada Arquitetural Afetada
            $ARCH_LAYER

            ---

            ## ⚠️ Anti-Pattern Detectado
            $ANTI_PATTERN

            ---

            ## 📝 Problema Arquitetural
            $PROBLEM

            ---

            ## 🔴 Estrutura Atual (Problemática)
            \`\`\`
            $CURRENT_STRUCTURE
            \`\`\`

            ---

            ## ✅ Estrutura Sugerida (Ideal)
            \`\`\`
            $SUGGESTED_STRUCTURE
            \`\`\`

            ---

            ## 🧱 Separação de Camadas Recomendada
            \`\`\`
            $SUGGESTED_LAYERS
            \`\`\`

            ---

            ## 🔄 Estratégia de Migração
            $MIGRATION_STRATEGY

            ---

            ## 📊 Impacto Técnico
            $TECHNICAL_IMPACT

            ---

            ## 💼 Impacto no Negócio
            $BUSINESS_IMPACT

            ---

            ## 📈 Impacto de Escalabilidade
            $SCALABILITY_IMPACT

            ---

            ## 🛠️ Impacto de Manutenção
            $MAINTENANCE_IMPACT

            ---

            ## ⚠️ Risco Arquitetural
            $RISK

            ---

            ## 🧪 Como Identificar
            $REPRODUCTION

            ---

            ## 💡 Solução Detalhada
            $SUGGESTION

            ---

            ## 🎯 Benefícios Esperados
            $BENEFITS

            ---

            ## 📈 Complexidade da Correção
            $COMPLEXITY

            ---
            > 🤖 Issue gerada automaticamente pelo **Test Architecture Auditor**
            "

            EXISTING=$(gh issue list --search "$TITLE in:title" --state all --json title --jq '.[0].title // empty' 2>/dev/null || echo "")
            if [ -n "$EXISTING" ]; then
              echo "⚠️ Issue já existe: $TITLE"
              continue
            fi

            LABELS="ai-arch-audit,category-architecture"
            PRIORITY_SLUG=$(echo "$PRIORITY" | tr '[:upper:]' '[:lower:]')
            case "$PRIORITY_SLUG" in
              crítica|critica|critical) LABELS="$LABELS,priority-critical" ;;
              alta|high)                LABELS="$LABELS,priority-high" ;;
              média|media|medium)       LABELS="$LABELS,priority-medium" ;;
              baixa|low)                LABELS="$LABELS,priority-low" ;;
            esac

            echo "🚀 Criando issue Arquitetura: $TITLE"
            gh issue create --title "$TITLE" --body "$BODY" --label "$LABELS"
            echo "✅ Issue criada: $TITLE"
            sleep 1

          done

          echo "✅ Auditoria de Arquitetura finalizada"