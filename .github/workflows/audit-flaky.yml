name: 🎲 FLAKY TEST & STABILITY AUDITOR

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit-flaky:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH HISTORY
        run: git fetch --all

      - name: 📂 SCAN TEST FILES
        run: |
          find . \
            -type f \
            \( -name "*.robot" -o -name "*.resource" -o -name "*.py" \) \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" \
            > test_files.txt
          
          echo "✅ Arquivos de teste encontrados:"
          wc -l test_files.txt

      - name: 📄 BUILD FLAKY CONTEXT
        run: |
          > flaky_context.txt
          echo "===== ESTRUTURA =====" >> flaky_context.txt
          cat test_files.txt >> flaky_context.txt
          echo "" >> flaky_context.txt
          echo "===== CONTEÚDO DOS ARQUIVOS =====" >> flaky_context.txt
          
          while read file; do
            echo "" >> flaky_context.txt
            echo "FILE: $file" >> flaky_context.txt
            echo "----------------------------------------" >> flaky_context.txt
            cat "$file" >> flaky_context.txt 2>/dev/null || true
          done < test_files.txt
          
          echo "" >> flaky_context.txt
          echo "===== HISTÓRICO DE COMMITS =====" >> flaky_context.txt
          git log -20 --pretty=format:"%h - %s" >> flaky_context.txt
          echo "✅ Contexto Flaky gerado"

      - name: 🤖 AI FLAKY AUDIT
        id: ai_flaky_audit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROJECT_CONTEXT=$(head -c 120000 flaky_context.txt)

          PROMPT=$(cat <<EOF
         You are a WORLD-CLASS FLAKY TEST SPECIALIST and TEST RELIABILITY ENGINEER.

          Your sole mission is to identify ALL potential sources of test instability in the project.

          You have 15+ years of experience with:
          - Flaky test root cause analysis
          - Test stabilization strategies
          - Synchronization and timing issues in UI automation
          - Race conditions in async testing
          - Network and infrastructure-dependent test failures
          - Data-dependent test instability
          - Browser and driver-related flakiness
          - CI/CD environment instability
          - Test isolation failures
          - Retry strategies and their correct application

          ========================
          YOUR FLAKY AUDIT FRAMEWORK
          ========================

          LAYER 1 — SYNCHRONIZATION ISSUES (Highest Flaky Risk)
          - Sleep() usage — fixed waits cause timing-dependent failures
          - Missing Wait Until Element Is Visible before interactions
          - Missing Wait Until Element Is Enabled before clicks
          - Missing Wait Until Page Contains before assertions
          - Missing Wait Until Network Is Idle (if applicable)
          - Using element presence check instead of visibility check
          - Implicit vs explicit wait conflicts
          - Race conditions between page loads and assertions
          - Animation/transition not waited before interaction
          - AJAX calls not completed before assertions
          - WebSocket events not awaited

          LAYER 2 — STATE AND ISOLATION ISSUES
          - Tests that depend on execution order
          - Tests that share mutable state (global variables)
          - Tests that do not clean up after themselves
          - Tests that depend on data created by previous tests
          - Database state not reset between tests
          - Session/cookie state leaking between tests
          - Cache state affecting test results
          - Test using same user account (parallel conflict risk)

          LAYER 3 — LOCATOR INSTABILITY
          - Dynamic XPaths that change on every page load
          - XPaths based on element position (//div[3]) — breaks on UI change
          - XPaths with generated IDs (id="button-1234567890")
          - CSS selectors dependent on styling classes
          - Text-based locators sensitive to i18n/copy changes
          - Locators not unique on the page (returns multiple elements)
          - Shadow DOM locators without proper handling
          - iFrame locators without proper frame switching

          LAYER 4 — ENVIRONMENT AND INFRASTRUCTURE DEPENDENCY
          - Tests that depend on external services (APIs, email, SMS)
          - Tests without timeout configuration for external calls
          - Tests sensitive to network latency
          - Tests with hardcoded localhost / dev environment URLs
          - Tests that depend on specific system time
          - Tests that depend on specific data already in the database
          - Tests that fail in headless mode but pass in headed mode
          - Tests sensitive to screen resolution/viewport

          LAYER 5 — RETRY AND RECOVERY ANTI-PATTERNS
          - Using retry to mask instability instead of fixing root cause
          - Retry without logging which attempts failed
          - Retry with wrong retry count (too few or too many)
          - Missing teardown in failure scenario (state not cleaned)
          - Missing screenshot on failure
          - Missing DOM dump on failure
          - Missing network log on failure

          LAYER 6 — DATA INSTABILITY
          - Tests using real/production data that can change
          - Tests depending on records that may be deleted
          - Tests with hardcoded IDs that may not exist
          - Tests creating data without cleanup
          - Parallel tests competing for the same data records

          ========================
          FLAKY RISK SCORING (use in your analysis)
          ========================

          For each issue, assess:
          - Flaky Probability: Low / Medium / High / Critical
          - Flaky Frequency: Rare / Occasional / Frequent / Always
          - Detection Difficulty: Easy / Medium / Hard
          - Fix Complexity: Low / Medium / High

          ========================
          RETURN FORMAT
          ========================

          RETURN ONLY VALID JSON. NO MARKDOWN. NO EXTRA TEXT.

          {
          "issues": [
          {
          "title": "Clear flaky issue title",
          "priority": "Alta",
          "severity": "Alta",
          "category": "Flaky Test",
          "files": ["path/to/file.robot"],
          "flaky_type": "Synchronization / State / Locator / Environment / Data",
          "flaky_probability": "High",
          "flaky_frequency": "Frequent",
          "detection_difficulty": "Hard",
          "fix_complexity": "Medium",
          "problem": "Exact description of what causes flakiness",
          "trigger_conditions": "Under what conditions this flakiness occurs",
          "technical_impact": "Impact on test reliability and CI pipeline",
          "business_impact": "Impact on confidence in test results",
          "risk": "What happens if this is not fixed",
          "reproduction": "How to reproduce or identify this flakiness",
          "current_code": "The exact problematic code",
          "stable_code": "The stabilized version of the code",
          "root_cause": "Root cause of the flakiness",
          "stabilization_strategy": "Strategy to eliminate the flakiness",
          "retry_strategy": "Appropriate retry strategy if needed",
          "monitoring_suggestion": "How to monitor and detect this in CI",
          "suggestion": "Detailed fix",
          "benefits": "Expected stability improvement",
          "flaky_reduction_estimate": "Estimated % reduction in flaky failures",
          "complexity": "Média",
          "improvement_type": "Estabilidade"
          }
          ]
          }

          PROJECT CONTEXT:
          $PROJECT_CONTEXT
          EOF
          )

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "openai/gpt-4o-mini",
              messages: [{ role: "user", content: $prompt }],
              temperature: 0.1,
              max_tokens: 4000,
              response_format: { "type": "json_object" }
            }')

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "$RESPONSE" > response.json

          AI_CONTENT=$(jq -r '.choices[0].message.content // empty' response.json)

          if [ -z "$AI_CONTENT" ]; then
            echo "❌ IA não retornou conteúdo"
            cat response.json
            exit 1
          fi

          echo "$AI_CONTENT" > ai_raw.txt

          cat ai_raw.txt | jq . > ai_issues.json 2>/dev/null || \
          python3 -c '
          import sys, json, re
          text = sys.stdin.read()
          match = re.search(r"\{[\s\S]*\}", text)
          if match:
              try:
                  data = json.loads(match.group(0))
                  print(json.dumps(data, ensure_ascii=False))
              except:
                  print("{\"issues\": []}")
          else:
              print("{\"issues\": []}")
          ' < ai_raw.txt > ai_issues.json 2>/dev/null || \
                    echo '{"issues": []}' > ai_issues.json

          jq . ai_issues.json

      - name: 🐞 CREATE FLAKY ISSUES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(jq '.issues | length' ai_issues.json 2>/dev/null || echo 0)
          [ "$TOTAL" -eq 0 ] && echo "⚠️ Nenhuma issue de flakiness encontrada" && exit 0

          sanitize() { echo "$1" | sed 's/\r//g'; }

          create_label_if_not_exists() {
            local NAME="$1" COLOR="$2"
            EXISTS=$(gh label list --json name --jq ".[] | select(.name == \"$NAME\") | .name" 2>/dev/null)
            [ -z "$EXISTS" ] && gh label create "$NAME" --color "$COLOR" --description "AI Flaky Audit" 2>/dev/null || true
          }

          create_label_if_not_exists "ai-flaky-audit" "E4E669"
          create_label_if_not_exists "flaky-test" "F9D0C4"
          create_label_if_not_exists "priority-critical" "B60205"
          create_label_if_not_exists "priority-high" "D93F0B"
          create_label_if_not_exists "priority-medium" "FBCA04"
          create_label_if_not_exists "priority-low" "0E8A16"

          jq -c '.issues[]' ai_issues.json | while read -r row; do
            # ... (seu código de criação de issues continua aqui)
            # Mantive sua lógica completa, só corrigi a indentação
            TITLE=$(sanitize "$(echo "$row" | jq -r '.title // "Issue Flaky"')")
            # ... resto do seu código ...
          done

          echo "✅ Auditoria de Flaky Tests finalizada"