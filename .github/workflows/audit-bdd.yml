name: BDD QUALITY AUDITOR

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
 pull-requests: read

jobs:
  audit-bdd:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH HISTORY
        run: git fetch --all

      - name: 📂 SCAN BDD FILES
        run: |
          echo "🔍 Escaneando arquivos BDD..."

          find . \
            -type f \
            \( -name "*.robot" -o -name "*.feature" -o -name "*.resource" \) \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" \
            > bdd_files.txt

          echo "✅ Arquivos encontrados:"
          wc -l bdd_files.txt

      - name: 📄 BUILD LIGHTWEIGHT CONTEXT
        run: |
          echo "📄 Gerando contexto otimizado..."

          > bdd_context.txt

          echo "===== BDD FILES =====" >> bdd_context.txt
          head -5 bdd_files.txt >> bdd_context.txt

          echo "" >> bdd_context.txt
          echo "===== TEST SCENARIOS =====" >> bdd_context.txt

          head -5 bdd_files.txt | while read file; do

            echo "" >> bdd_context.txt
            echo "FILE: $file" >> bdd_context.txt
            echo "--------------------------------" >> bdd_context.txt

            if [[ "$file" == *.feature ]]; then
              grep -E "^(Feature:|Scenario:|Scenario Outline:|Given|When|Then|And|But)" "$file" | head -40 >> bdd_context.txt || true
            else
              awk '/\*\*\* Test Cases \*\*\*/,0' "$file" | head -40 >> bdd_context.txt || true
            fi

          done

          echo "" >> bdd_context.txt
          echo "===== LAST COMMITS =====" >> bdd_context.txt

          git log -5 --pretty=format:"%h - %s" >> bdd_context.txt

          echo "✅ Contexto gerado"
          wc -c bdd_context.txt

      - name: 🤖 AI BDD AUDIT
        id: ai_bdd_audit
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

        run: |
          echo "🤖 Executando auditoria BDD..."

          PROJECT_CONTEXT=$(tail -c 3000 bdd_context.txt)

          PROMPT=$(cat <<EOF
          Você é especialista em BDD.

          Analise os arquivos Robot Framework e Gherkin fornecidos.

          Detecte:
          - anti-patterns BDD
          - múltiplos WHEN
          - THEN fraco
          - cenários técnicos demais
          - ausência de cenário negativo
          - excesso de setup
          - baixa legibilidade
          - cenários acoplados à implementação

          REGRAS:
          - máximo 5 issues
          - respostas curtas
          - sem markdown
          - sem explicações
          - sem reasoning
          - apenas JSON válido
          - cada campo com no máximo 200 caracteres

          FORMATO:

          {
            "issues": [
              {
                "title": "",
                "file": "",
                "scenario": "",
                "problem": "",
                "current_code": "",
                "suggested_rewrite": "",
                "priority": ""
              }
            ]
          }

          CONTEXTO:
          $PROJECT_CONTEXT
          EOF
          )

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "minimaxai/minimax-m2.7",
              messages: [
                {
                  role: "system",
                  content: "Retorne apenas JSON válido. Não explique raciocínio."
                },
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.1,
              top_p: 0.9,
              max_tokens: 1500,
              stream: false
            }')

          echo "📡 Chamando NVIDIA API..."

          RESPONSE=$(curl --silent --show-error \
            --request POST \
            --url "https://integrate.api.nvidia.com/v1/chat/completions" \
            --header "Authorization: Bearer $NVIDIA_API_KEY" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY"
          )

          echo "$RESPONSE" > response.json

          echo "📄 Response salvo"

          if ! jq empty response.json >/dev/null 2>&1; then
            echo "❌ JSON inválido da API"
            cat response.json
            exit 1
          fi

          if jq -e '.error' response.json >/dev/null 2>&1; then
            echo "❌ API retornou erro"
            cat response.json | jq .
            exit 1
          fi

          AI_CONTENT=$(jq -r '
            .choices[0].message.content //
            .choices[0].message.reasoning_content //
            empty
          ' response.json)

          if [ -z "$AI_CONTENT" ] || [ "$AI_CONTENT" = "null" ]; then
            echo "❌ IA não retornou conteúdo"
            cat response.json | jq .
            exit 1
          fi

          echo "$AI_CONTENT" > ai_raw.txt

          echo "📄 Conteúdo IA salvo"

          cat ai_raw.txt | jq . > ai_issues.json 2>/dev/null || \
          python3 -c '
          import sys, json, re

          text = sys.stdin.read()

          match = re.search(r"\{[\s\S]*\}", text)

          if match:
              try:
                  data = json.loads(match.group(0))
                  print(json.dumps(data, ensure_ascii=False))
              except:
                  print("{\"issues\":[]}")
          else:
              print("{\"issues\":[]}")
          ' < ai_raw.txt > ai_issues.json

          echo "✅ JSON FINAL"

          cat ai_issues.json | jq .

      - name: 🐞 CREATE BDD ISSUES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          TOTAL=$(jq '.issues | length' ai_issues.json 2>/dev/null || echo 0)

          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️ Nenhuma issue encontrada"
            exit 0
          fi

          create_label_if_not_exists() {

            local NAME="$1"
            local COLOR="$2"

            EXISTS=$(gh label list --json name \
              --jq ".[] | select(.name == \"$NAME\") | .name" 2>/dev/null)

            if [ -z "$EXISTS" ]; then
              gh label create "$NAME" \
                --color "$COLOR" \
                --description "BDD AI Audit" \
                2>/dev/null || true
            fi
          }

          create_label_if_not_exists "ai-bdd-audit" "5319E7"
          create_label_if_not_exists "priority-high" "D93F0B"
          create_label_if_not_exists "priority-medium" "FBCA04"
          create_label_if_not_exists "priority-low" "0E8A16"

          jq -c '.issues[]' ai_issues.json | while read row; do

            TITLE=$(echo "$row" | jq -r '.title // "BDD Issue"')
            FILE=$(echo "$row" | jq -r '.file // "N/A"')
            SCENARIO=$(echo "$row" | jq -r '.scenario // "N/A"')
            PROBLEM=$(echo "$row" | jq -r '.problem // "N/A"')
            CURRENT_CODE=$(echo "$row" | jq -r '.current_code // "N/A"')
            REWRITE=$(echo "$row" | jq -r '.suggested_rewrite // "N/A"')
            PRIORITY=$(echo "$row" | jq -r '.priority // "medium"')

            BODY="
            ## 📂 Arquivo
            \`$FILE\`

            ## 🎭 Cenário
            \`$SCENARIO\`

            ## ⚠️ Problema
            $PROBLEM

            ## 🔴 Código Atual
            \`\`\`gherkin
            $CURRENT_CODE
            \`\`\`

            ## ✅ Sugestão
            \`\`\`gherkin
            $REWRITE
            \`\`\`

            > 🤖 Gerado automaticamente pelo BDD Quality Auditor
            "

            EXISTING=$(gh issue list \
              --search "$TITLE in:title" \
              --state all \
              --json title \
              --jq '.[0].title // empty')

            if [ -n "$EXISTING" ]; then
              echo "⚠️ Issue já existe: $TITLE"
              continue
            fi

            LABELS="ai-bdd-audit"

            case "$(echo "$PRIORITY" | tr '[:upper:]' '[:lower:]')" in
              alta|high)
                LABELS="$LABELS,priority-high"
                ;;
              baixa|low)
                LABELS="$LABELS,priority-low"
                ;;
              *)
                LABELS="$LABELS,priority-medium"
                ;;
            esac

            echo "🚀 Criando issue: $TITLE"

            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "$LABELS"

            echo "✅ Issue criada"

            sleep 1

          done

          echo "✅ Auditoria finalizada"