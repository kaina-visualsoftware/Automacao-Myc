name: ROBOT FRAMEWORK AUDITOR

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit-robot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH HISTORY
        run: git fetch --all

      - name: 📂 SCAN ROBOT FILES
        run: |
          echo "🔍 Escaneando arquivos Robot Framework..."
          find . \
            -type f \
            \( -name "*.robot" -o -name "*.resource" \) \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" \
            > robot_files.txt
          
          echo "✅ Arquivos Robot encontrados:"
          wc -l robot_files.txt

      - name: 📄 BUILD ROBOT CONTEXT
        run: |
          echo "📄 Gerando contexto Robot Framework..."
          > robot_context.txt
          echo "===== ESTRUTURA ROBOT =====" >> robot_context.txt
          cat robot_files.txt | head -40 >> robot_context.txt
          
          echo "" >> robot_context.txt
          echo "===== AMOSTRA DE ARQUIVOS IMPORTANTES =====" >> robot_context.txt
          
          head -15 robot_files.txt | while read file; do
            echo "" >> robot_context.txt
            echo "FILE: $file" >> robot_context.txt
            echo "----------------------------------------" >> robot_context.txt
            head -90 "$file" >> robot_context.txt 2>/dev/null || true
            echo "... (truncado)" >> robot_context.txt
          done
          
          echo "" >> robot_context.txt
          echo "===== ÚLTIMOS COMMITS =====" >> robot_context.txt
          git log -12 --pretty=format:"%h - %an - %s" >> robot_context.txt
          
          echo "✅ Contexto Robot gerado ($(wc -c < robot_context.txt) bytes)"

      - name: 🤖 AI ROBOT AUDIT
        id: ai_robot_audit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🤖 Executando auditoria Robot Framework..."
          PROJECT_CONTEXT=$(tail -c 8000 robot_context.txt)

          PROMPT=$(cat <<EOF
          Você é um ESPECIALISTA MUNDIAL EM ROBOT FRAMEWORK e ARQUITETO DE AUTOMAÇÃO.

          Sua única missão é realizar uma AUDITORIA PROFUNDA E CIRÚRGICA no código Robot Framework do projeto abaixo.

          Você possui 15+ anos de experiência com:
          - Internals e boas práticas do Robot Framework
          - SeleniumLibrary, Playwright, RequestsLibrary, AppiumLibrary
          - Arquitetura de testes orientada a keywords (Keyword-Driven Testing)
          - Design de testes orientados a dados (Data-Driven Testing)
          - Design e organização de arquivos resource
          - Escopo e ciclo de vida de variáveis no Robot Framework
          - Desenvolvimento de bibliotecas customizadas (Python + Robot)
          - Page Object Model aplicado ao Robot Framework
          - Relatórios e logging no Robot Framework
          - RPA com Robot Framework

          ========================
          SEU FRAMEWORK DE AUDITORIA ROBOT
          ========================

          CAMADA 1 — DESIGN DE KEYWORDS
          - A keyword faz UMA única coisa? (Responsabilidade Única)
          - O nome da keyword é uma ação clara e legível para o negócio?
          - O nome da keyword usa a forma verbal correta? (ex.: "Realizar Login Como Usuário Administrador")
          - A keyword é longa demais? (mais de 15 passos é um sinal de alerta)
          - A keyword possui parâmetros em excesso? (mais de 5 é um sinal de alerta)
          - Os parâmetros estão documentados? (seção Documentation)
          - Os valores padrão de parâmetros estão sendo usados corretamente?
          - Existem keywords que nunca são chamadas? (keywords mortas)
          - Existem keywords duplicadas em diferentes arquivos resource?
          - Existem keywords que deveriam ser decompostas em sub-keywords?
          - O nível de abstração da keyword é consistente? (mistura de alto e baixo nível)
          - Existem keywords de Setup/Teardown excessivamente complexas?

          CAMADA 2 — USO DE VARIÁVEIS
          - Existem strings hardcoded que deveriam ser variáveis?
          - As variáveis estão nomeadas usando SCREAMING_SNAKE_CASE? (${MINHA_VAR})
          - Variáveis de nível de suíte estão vazando para o escopo dos testes?
          - Existem variáveis definidas em um teste que afetam outro? (poluição de estado)
          - Set Global Variable / Set Suite Variable estão sendo usados em excesso?
          - Locators estão hardcoded nos arquivos de teste em vez de nos arquivos resource?
          - Valores específicos de ambiente estão devidamente externalizados?
          - Credenciais/segredos estão hardcoded nos arquivos de teste?

          CAMADA 3 — WAITS E SINCRONIZAÇÃO
          - Sleep está sendo usado em algum lugar? (sempre um sinal de alerta)
          - Os waits estão usando corretamente as keywords Wait Until...?
          - Os timeouts de wait estão hardcoded em vez de usar variáveis?
          - Existem waits ausentes antes de interações críticas?
          - Existem race conditions em cenários assíncronos?
          - Wait Until Keyword Succeeds está sendo usado corretamente?
          - Waits implícitos e explícitos estão em conflito?

          CAMADA 4 — ORGANIZAÇÃO DE RESOURCES
          - Os resources estão organizados logicamente por domínio/funcionalidade?
          - Existem resources que fazem coisas demais? (God resource)
          - Os locators estão armazenados em arquivos resource dedicados?
          - Os dados de teste / variáveis estão separados da lógica?
          - Existe uma convenção de nomenclatura clara para os arquivos resource?
          - Os imports estão organizados de forma consistente? (Library → Resource → Variables)
          - Existem imports circulares entre resources?
          - Existem imports duplicados de Library em múltiplos arquivos?

          CAMADA 5 — ESTRUTURA DOS TESTES
          - Os testes possuem Setup e Teardown adequados?
          - Os testes estão devidamente isolados? (sem estado compartilhado entre testes)
          - Os dados de teste são resetados entre os testes?
          - Existem dependências entre testes? (teste A precisa rodar antes do teste B)
          - As tags estão sendo usadas para filtrar os testes corretamente?
          - Existem testes sem nenhuma asserção?
          - As asserções estão usando mensagens significativas?
          - Existe interação excessiva com UI que poderia ser substituída por chamadas de API?

          CAMADA 6 — ANTI-PATTERNS
          - "God keyword" — keyword fazendo coisas demais
          - "Locator hardcoded" — XPath/CSS diretamente nos passos do teste
          - "Sleep-driven testing" — uso de Sleep em vez de waits adequados
          - "Poluição de estado" — testes dependendo do estado de testes anteriores
          - "Keyword morta" — keyword definida mas nunca utilizada
          - "Keyword copy-paste" — lógica duplicada em múltiplas keywords
          - "Magic string" — valores hardcoded sem explicação
          - "Asserções implícitas" — ausência de Should Be / Should Contain explícitos
          - "God resource" — um único arquivo resource fazendo tudo
          - "Teste sem limpeza" — ausência de teardown para resetar o estado

          ========================
          REGRAS DE SAÍDA DA AUDITORIA
          ========================

          - Reporte APENAS problemas REAIS encontrados nos arquivos fornecidos
          - NÃO invente nomes de arquivos ou keywords
          - SEMPRE cite o arquivo EXATO e o nome da keyword
          - SEMPRE mostre o código atual problemático
          - SEMPRE mostre a versão ideal refatorada
          - Gere no máximo 10 issues
          - Priorize os problemas de MAIOR IMPACTO

          ========================
          FORMATO DE RETORNO
          ========================

          RETORNE APENAS JSON VÁLIDO. SEM MARKDOWN. SEM TEXTO ADICIONAL.

          {
            "issues": [
              {
                "title": "Título técnico claro",
                "priority": "Alta",
                "severity": "Alta",
                "category": "Design de Keyword",
                "files": ["caminho/para/arquivo.robot"],
                "keyword_name": "Nome exato da keyword com o problema",
                "anti_pattern": "Qual anti-pattern do Robot Framework este representa",
                "problem": "Descrição extremamente detalhada do problema encontrado no Robot Framework",
                "technical_impact": "Impacto na confiabilidade dos testes e manutenção",
                "business_impact": "Impacto na velocidade de entrega e confiança",
                "risk": "Qual risco isso introduz",
                "reproduction": "Como identificar este problema no código",
                "current_code": "O código Robot atual problemático exato",
                "refactored_code": "O código Robot ideal refatorado",
                "variable_improvements": "Sugestões de refatoração de variáveis",
                "keyword_strategy": "Estratégia sugerida de decomposição de keywords",
                "resource_strategy": "Reorganização sugerida dos resources",
                "suggestion": "Sugestão detalhada de correção",
                "benefits": "Benefícios esperados",
                "complexity": "Baixa",
                "improvement_type": "Refatoração"
              }
            ]
          }

          PROJECT CONTEXT:
          $PROJECT_CONTEXT
          EOF
          )

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "openai/gpt-4o-mini",
              messages: [{ role: "user", content: $prompt }],
              temperature: 0.1,
              max_tokens: 2500,
              response_format: { "type": "json_object" }
            }')

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "$RESPONSE" > response.json

          AI_CONTENT=$(jq -r '.choices[0].message.content // empty' response.json)

          if [ -z "$AI_CONTENT" ]; then
            echo "❌ IA não retornou conteúdo"
            cat response.json
            exit 1
          fi

          echo "$AI_CONTENT" > ai_raw.txt

          cat ai_raw.txt | jq . > ai_issues.json 2>/dev/null || \
          python3 -c '
          import sys, json, re
          text = sys.stdin.read()
          match = re.search(r"\{[\s\S]*\}", text)
          if match:
              try:
                  data = json.loads(match.group(0))
                  print(json.dumps(data, ensure_ascii=False))
              except:
                  print("{\"issues\": []}")
          else:
              print("{\"issues\": []}")
          ' < ai_raw.txt > ai_issues.json 2>/dev/null || echo '{"issues": []}' > ai_issues.json

          echo "✅ JSON Robot gerado com $(jq '.issues | length' ai_issues.json 2>/dev/null || echo 0) issues"

      - name: 🐞 CREATE ROBOT ISSUES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(jq '.issues | length' ai_issues.json 2>/dev/null || echo 0)
          [ "$TOTAL" -eq 0 ] && echo "⚠️ Nenhuma issue Robot encontrada" && exit 0

          sanitize() { echo "$1" | sed 's/\r//g'; }

          create_label_if_not_exists() {
            local NAME="$1" COLOR="$2"
            EXISTS=$(gh label list --json name --jq ".[] | select(.name == \"$NAME\") | .name" 2>/dev/null)
            [ -z "$EXISTS" ] && gh label create "$NAME" --color "$COLOR" --description "AI Robot Audit" 2>/dev/null || true
          }

          create_label_if_not_exists "ai-robot-audit" "0075CA"
          create_label_if_not_exists "priority-critical" "B60205"
          create_label_if_not_exists "priority-high" "D93F0B"
          create_label_if_not_exists "priority-medium" "FBCA04"
          create_label_if_not_exists "priority-low" "0E8A16"
          create_label_if_not_exists "category-robot" "1D76DB"

          jq -c '.issues[]' ai_issues.json | while read -r row; do
            TITLE=$(sanitize "$(echo "$row" | jq -r '.title // "Issue Robot Framework"')")
            PRIORITY=$(sanitize "$(echo "$row" | jq -r '.priority // "Média"')")
            SEVERITY=$(sanitize "$(echo "$row" | jq -r '.severity // "Média"')")
            CATEGORY=$(sanitize "$(echo "$row" | jq -r '.category // "Robot Framework"')")
            KEYWORD_NAME=$(sanitize "$(echo "$row" | jq -r '.keyword_name // "Não identificado"')")
            ANTI_PATTERN=$(sanitize "$(echo "$row" | jq -r '.anti_pattern // "Não identificado"')")
            PROBLEM=$(sanitize "$(echo "$row" | jq -r '.problem // "Não informado"')")
            TECHNICAL_IMPACT=$(sanitize "$(echo "$row" | jq -r '.technical_impact // "Não informado"')")
            BUSINESS_IMPACT=$(sanitize "$(echo "$row" | jq -r '.business_impact // "Não informado"')")
            RISK=$(sanitize "$(echo "$row" | jq -r '.risk // "Não informado"')")
            REPRODUCTION=$(sanitize "$(echo "$row" | jq -r '.reproduction // "Não informado"')")
            CURRENT_CODE=$(sanitize "$(echo "$row" | jq -r '.current_code // "Não informado"')")
            REFACTORED_CODE=$(sanitize "$(echo "$row" | jq -r '.refactored_code // "Não informado"')")
            VARIABLE_IMPROVEMENTS=$(sanitize "$(echo "$row" | jq -r '.variable_improvements // "Não informado"')")
            KEYWORD_STRATEGY=$(sanitize "$(echo "$row" | jq -r '.keyword_strategy // "Não informado"')")
            RESOURCE_STRATEGY=$(sanitize "$(echo "$row" | jq -r '.resource_strategy // "Não informado"')")
            SUGGESTION=$(sanitize "$(echo "$row" | jq -r '.suggestion // "Não informado"')")
            BENEFITS=$(sanitize "$(echo "$row" | jq -r '.benefits // "Não informado"')")
            COMPLEXITY=$(sanitize "$(echo "$row" | jq -r '.complexity // "Média"')")
            IMPROVEMENT_TYPE=$(sanitize "$(echo "$row" | jq -r '.improvement_type // "Refatoração"')")

            FILES_FORMATTED=""
            FILES_COUNT=$(echo "$row" | jq '.files | length' 2>/dev/null || echo "0")
            if [ "$FILES_COUNT" -gt 0 ]; then
              FILES_FORMATTED=$(echo "$row" | jq -r '.files[]' | while read -r f; do echo "- \`$f\`"; done)
            else
              FILES_FORMATTED="- Não identificado"
            fi

            BODY="
            ## 🤖 Categoria Robot Framework
            $CATEGORY — $IMPROVEMENT_TYPE

            ## 🔥 Prioridade | 🚨 Severidade
            $PRIORITY | $SEVERITY

            ---
            ## 📂 Arquivos Afetados
            $FILES_FORMATTED

            ---
            ## 🔑 Keyword Problemática
            \`$KEYWORD_NAME\`

            ---
            ## ⚠️ Anti-Pattern Detectado
            $ANTI_PATTERN

            ---
            ## 📝 Problema Identificado
            $PROBLEM

            ---
            ## 🔴 Código Atual
            \`\`\`robot
            $CURRENT_CODE
            \`\`\`

            ---
            ## ✅ Código Refatorado
            \`\`\`robot
            $REFACTORED_CODE
            \`\`\`

            ---
            ## 📊 Impacto Técnico
            $TECHNICAL_IMPACT

            ---
            ## 💼 Impacto no Negócio
            $BUSINESS_IMPACT

            ---
            ## ⚠️ Risco
            $RISK

            ---
            ## 💡 Sugestão
            $SUGGESTION

            ---
            ## 🎯 Benefícios
            $BENEFITS

            > 🤖 Issue gerada automaticamente pelo **Robot Framework Auditor**
            "

            EXISTING=$(gh issue list --search "$TITLE in:title" --state all --json title --jq '.[0].title // empty' 2>/dev/null || echo "")

            if [ -n "$EXISTING" ]; then
              echo "⚠️ Issue já existe: $TITLE"
              continue
            fi

            LABELS="ai-robot-audit,category-robot"
            PRIORITY_SLUG=$(echo "$PRIORITY" | tr '[:upper:]' '[:lower:]')
            case "$PRIORITY_SLUG" in
              crítica|critica|critical) LABELS="$LABELS,priority-critical" ;;
              alta|high)                LABELS="$LABELS,priority-high" ;;
              média|media|medium)       LABELS="$LABELS,priority-medium" ;;
              baixa|low)                LABELS="$LABELS,priority-low" ;;
            esac

            echo "🚀 Criando issue Robot: $TITLE"
            gh issue create --title "$TITLE" --body "$BODY" --label "$LABELS"
            echo "✅ Issue criada: $TITLE"
            sleep 1
          done

          echo "✅ Auditoria Robot Framework finalizada"