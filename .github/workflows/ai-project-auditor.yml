name: AI PROJECT AUDITOR

on:
  push:
    branches:
      - develop

  workflow_dispatch:
  
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit-project:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH HISTORY
        run: |
          git fetch --all

      - name: 📂 SCAN PROJECT FILES
        run: |
          echo "🔍 Escaneando projeto..."

          find . \
            -type f \
            \( \
              -name "*.robot" -o \
              -name "*.resource" -o \
              -name "*.py" -o \
              -name "*.js" -o \
              -name "*.ts" -o \
              -name "*.json" -o \
              -name "*.md" -o \
              -name "*.yml" -o \
              -name "*.yaml" \
            \) \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" \
            > project_files.txt

          echo "✅ Arquivos encontrados:"
          wc -l project_files.txt

      - name: 📄 BUILD PROJECT CONTEXT
        run: |
          echo "📄 Gerando contexto do projeto..."

          > project_context.txt

          echo "===== ESTRUTURA DO PROJETO =====" >> project_context.txt
          head -200 project_files.txt >> project_context.txt

          echo "" >> project_context.txt
          echo "===== AMOSTRA DE CONTEÚDO =====" >> project_context.txt

          while read file; do
            echo "" >> project_context.txt
            echo "FILE: $file" >> project_context.txt
            echo "----------------------------------------" >> project_context.txt

            head -80 "$file" >> project_context.txt 2>/dev/null || true

          done < <(head -20 project_files.txt)

          echo "" >> project_context.txt
          echo "===== ÚLTIMOS COMMITS =====" >> project_context.txt

          git log -20 --pretty=format:"%h - %s" >> project_context.txt

          echo "✅ Contexto gerado"

      - name: 🤖 AI AUDIT
        id: ai_audit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🤖 Executando auditoria IA..."

          PROJECT_CONTEXT=$(head -c 120000 project_context.txt)

          PROMPT=$(cat <<EOF
          Você é um especialista SÊNIOR em:

          SHOW ME EVERYTHING YOU CAN DELIVER IN THIS PROJECT AUDIT.
          ACT AS:
          - QA ARCHITECT
          - QA SENIOR
          - SOFTWARE ARCHITECT
          - TECH LEAD
          - BDD SPECIALIST
          - AUTOMATION SPECIALIST
          - SENIOR REVIEWER
          - ENTERPRISE QUALITY ENGINEER

          PERFORM A COMPLETE TECHNICAL AUDIT OF THE PROJECT.

          ANALYZE DEEPLY:

          ========================
          BDD / GHERKIN
          ========================
          - GIVEN / WHEN / THEN misuse
          - Weak THEN validations
          - Non-behavior-oriented scenarios
          - Technical instead of business language
          - Poor readability
          - Missing business context
          - Multi-responsibility scenarios
          - Missing negative scenarios
          - Missing edge cases
          - Duplicate scenarios
          - Repeated steps
          - Generic steps
          - Flaky scenarios
          - Coupled scenarios
          - Missing assertions
          - Bad naming patterns
          - Poor acceptance criteria representation

          ========================
          ROBOT FRAMEWORK
          ========================
          - Giant keywords
          - Multiple responsibilities in keywords
          - Duplicated keywords
          - Weak abstraction
          - Hardcoded values
          - Bad variable usage
          - Incorrect waits
          - Synchronization problems
          - Bad resource organization
          - Lack of modularization
          - Poor reuse strategy
          - Low maintainability
          - Lack of standardization
          - Poor keyword naming
          - High coupling
          - Low cohesion

          ========================
          TEST ARCHITECTURE
          ========================
          - Folder structure problems
          - Scalability issues
          - Maintainability risks
          - Weak separation of concerns
          - Poor organization
          - Missing layers
          - Weak componentization
          - Lack of reusable flows
          - Shared state risks
          - Poor test isolation
          - Weak data strategy
          - Fragile test design

          ========================
          QUALITY ENGINEERING
          ========================
          - Missing validations
          - Missing logs
          - Weak traceability
          - Poor observability
          - Weak debugging capability
          - Weak error handling
          - Poor failure diagnostics
          - Missing screenshots/evidences
          - Weak reporting strategy
          - Missing retry strategy
          - Weak flaky test mitigation

          ========================
          CI/CD
          ========================
          - Weak pipeline structure
          - Missing quality gates
          - Missing static validations
          - Weak PR validation
          - Weak branch strategy
          - Poor automation governance
          - Missing parallelization opportunities
          - Missing optimization opportunities

          ========================
          PERFORMANCE / STABILITY
          ========================
          - Slow execution risks
          - Repeated unnecessary flows
          - Overuse of UI interactions
          - Weak caching strategy
          - Synchronization bottlenecks
          - Potential flaky behaviors
          - Unstable waits
          - Timing dependencies

          ========================
          CLEAN CODE
          ========================
          - Poor naming
          - Duplicate logic
          - Dead code
          - Overengineering
          - Lack of standards
          - Poor readability
          - Excessive complexity
          - Technical debt indicators

          ========================
          FOR EACH ISSUE FOUND
          ========================

          RETURN:
          - Title
          - Priority
          - Severity
          - Category
          - Affected files
          - Exact technical problem
          - Exact business problem
          - Real risk
          - Technical impact
          - Business impact
          - Scalability impact
          - Maintenance impact
          - Why this is dangerous
          - Real examples found
          - Root cause
          - Recommended refactor
          - Suggested architecture
          - Example of ideal implementation
          - Example of ideal BDD rewrite
          - Suggested reusable keyword strategy
          - Suggested modularization strategy
          - Suggested folder organization
          - Suggested validation improvements
          - Suggested CI/CD improvements
          - Estimated complexity
          - Estimated technical debt reduction
          - Estimated flaky reduction
          - Estimated maintainability gain

          ONLY REPORT REAL PROBLEMS FOUND.
          DO NOT INVENT FILES.
          DO NOT GENERATE GENERIC FEEDBACK.

          THINK LIKE:
          - A SENIOR QA AUDITING AN ENTERPRISE PROJECT
          - A TECH LEAD REVIEWING A CRITICAL AUTOMATION PLATFORM
          - A BDD SPECIALIST ENFORCING BEST PRACTICES
          - AN ARCHITECT TRYING TO REDUCE TECHNICAL DEBT

          BE EXTREMELY DETAILED, CRITICAL, TECHNICAL, AND ACTIONABLE.

          - Robot Framework
          - QA Automation
          - Arquitetura de testes
          - BDD
          - Engenharia de software
          - Refatoração
          - Clean Code
          - Escalabilidade
          - Padrões de automação
          - Revisão técnica
          - Product Ownership técnico
          - Liderança técnica QA

          Você está atuando como:
          - QA Senior
          - Dev Senior
          - Arquiteto de automação
          - Revisor técnico do projeto
          - PO técnico

          Sua missão é realizar uma AUDITORIA TÉCNICA PROFUNDA no projeto abaixo.

          Analise profundamente:

          1. Estrutura do projeto
          2. Organização de pastas
          3. Reaproveitamento de keywords
          4. Duplicidade de código
          5. Problemas de BDD
          6. Má nomenclatura
          7. Casos de teste frágeis
          8. Ausência de cenários negativos
          9. Falta de validações
          10. Falta de asserts importantes
          11. Keywords muito grandes
          12. Keywords com múltiplas responsabilidades
          13. Problemas de legibilidade
          14. Possíveis bugs
          15. Fluxos mal desacoplados
          16. Problemas de manutenção
          17. Problemas de escalabilidade
          18. Problemas de performance
          19. Acoplamento excessivo
          20. Falta de parametrização
          21. Casos de teste repetitivos
          22. Uso incorreto de variáveis
          23. Problemas de waits
          24. Problemas de sincronização
          25. Uso incorreto de massa de testes
          26. Melhorias arquiteturais
          27. Melhorias para CI/CD
          28. Melhorias em logs
          29. Melhorias em rastreabilidade
          30. Melhorias em observabilidade
          31. Melhorias em debugging
          32. Melhorias de padronização
          33. Melhorias para reduzir flaky tests
          34. Possíveis gargalos técnicos
          35. Melhorias em reutilização
          36. Melhorias de componentização
          37. Melhorias em organização BDD
          38. Cenários de teste ausentes
          39. Melhorias em cobertura de testes
          40. Melhorias em clareza funcional

          - Gere NO MÁXIMO 10 issues
          - Gere SOMENTE issues realmente relevantes
          - NÃO invente arquivos inexistentes
          - NÃO gere sugestões genéricas
          - Seja extremamente técnico
          - Seja extremamente específico
          - Seja detalhista
          - Explique exatamente ONDE o problema aparece
          - Cite os ARQUIVOS envolvidos
          - Explique o IMPACTO real do problema
          - Explique COMO resolver
          - Explique o GANHO da melhoria
          - Explique os RISCOS atuais
          - Explique exemplos reais encontrados
          - Pense como um QA Senior revisando um projeto enterprise

          Para cada issue encontrada, informe:

          - Título técnico e claro
          - Prioridade real
          - Categoria
          - Arquivos afetados
          - Problema identificado
          - Impacto técnico
          - Impacto no negócio
          - Risco atual
          - Como reproduzir o problema
          - Sugestão detalhada de solução
          - Exemplo técnico prático
          - Benefícios esperados
          - Complexidade estimada
          - Tipo da melhoria

          Use:
          - Crítica
          - Alta
          - Média
          - Baixa

          Exemplos:
          - BDD
          - Arquitetura
          - Refatoração
          - Performance
          - Flaky Test
          - Organização
          - Reutilização
          - Validação
          - Cenário Negativo
          - Bug Potencial
          - Escalabilidade
          - Naming
          - CI/CD
          - Logging
          - Keyword Design
          - Clean Code

          RETORNE APENAS JSON VÁLIDO.

          NÃO use:
          - markdown externo
          - comentários
          - explicações fora do JSON
          - blocos markdown
          - texto adicional

          FORMATO:

          {
            "issues": [
              {
                "title": "Título técnico",
                "priority": "Alta",
                "category": "BDD",
                "files": [
                  "caminho/arquivo.robot",
                  "outro/arquivo.robot"
                ],
                "problem": "Descrição extremamente detalhada do problema encontrado",
                "technical_impact": "Impacto técnico",
                "business_impact": "Impacto no negócio",
                "risk": "Risco atual",
                "reproduction": "Como reproduzir",
                "suggestion": "Solução detalhada",
                "example": "Exemplo técnico prático",
                "benefits": "Benefícios esperados",
                "complexity": "Baixa/Média/Alta",
                "improvement_type": "Refatoração"
              }
            ]
          }

          $PROJECT_CONTEXT
          EOF
          )

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "openai/gpt-4o-mini",
              messages: [
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.1,
              max_tokens: 4000,
              response_format: { "type": "json_object" }
            }')

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "$RESPONSE" > response.json

          echo "📥 Resposta recebida"

          AI_CONTENT=$(jq -r '.choices[0].message.content // empty' response.json)

          if [ -z "$AI_CONTENT" ]; then
            echo "❌ IA não retornou conteúdo"
            cat response.json
            exit 1
          fi

          echo "$AI_CONTENT" > ai_raw.txt

          cat ai_raw.txt | jq . > ai_issues.json 2>/dev/null || \
          python3 -c '
          import sys, json, re
          text = sys.stdin.read()
          match = re.search(r"\{[\s\S]*\}", text)

          if match:
              try:
                  data = json.loads(match.group(0))
                  print(json.dumps(data, ensure_ascii=False))
              except:
                  print("{\"issues\": []}")
          else:
              print("{\"issues\": []}")
          ' < ai_raw.txt > ai_issues.json 2>/dev/null || \
          echo '{"issues": []}' > ai_issues.json

          echo "✅ JSON validado"

          jq . ai_issues.json

      - name: 🐞 CREATE GITHUB ISSUES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🐞 Criando issues..."

          TOTAL=$(jq '.issues | length' ai_issues.json 2>/dev/null || echo 0)

          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️ Nenhuma issue encontrada"
            exit 0
          fi

          sanitize() {
            echo "$1" | sed 's/\r//g'
          }

          create_label_if_not_exists() {
            local LABEL_NAME="$1"
            local LABEL_COLOR="$2"

            EXISTS=$(gh label list --json name --jq ".[] | select(.name == \"$LABEL_NAME\") | .name" 2>/dev/null)

            if [ -z "$EXISTS" ]; then
              echo "🏷️ Criando label: $LABEL_NAME"
              gh label create "$LABEL_NAME" \
                --color "$LABEL_COLOR" \
                --description "Criada automaticamente pela auditoria IA" \
                2>/dev/null || true
            fi
          }

          # Labels padrão
          create_label_if_not_exists "ai-audit" "5319E7"
          create_label_if_not_exists "priority-critical" "B60205"
          create_label_if_not_exists "priority-high" "D93F0B"
          create_label_if_not_exists "priority-medium" "FBCA04"
          create_label_if_not_exists "priority-low" "0E8A16"

          jq -c '.issues[]' ai_issues.json | while read -r row; do

            TITLE=$(sanitize "$(echo "$row" | jq -r '.title // "Issue sem título"')")
            PRIORITY=$(sanitize "$(echo "$row" | jq -r '.priority // "Média"')")
            SEVERITY=$(sanitize "$(echo "$row" | jq -r '.severity // "Média"')")
            CATEGORY=$(sanitize "$(echo "$row" | jq -r '.category // "Geral"')")

            PROBLEM=$(sanitize "$(echo "$row" | jq -r '.problem // "Não informado"')")
            TECHNICAL_IMPACT=$(sanitize "$(echo "$row" | jq -r '.technical_impact // "Não informado"')")
            BUSINESS_IMPACT=$(sanitize "$(echo "$row" | jq -r '.business_impact // "Não informado"')")
            SCALABILITY_IMPACT=$(sanitize "$(echo "$row" | jq -r '.scalability_impact // "Não informado"')")
            MAINTENANCE_IMPACT=$(sanitize "$(echo "$row" | jq -r '.maintenance_impact // "Não informado"')")
            RISK=$(sanitize "$(echo "$row" | jq -r '.risk // "Não informado"')")
            ROOT_CAUSE=$(sanitize "$(echo "$row" | jq -r '.root_cause // "Não identificado"')")
            REPRODUCTION=$(sanitize "$(echo "$row" | jq -r '.reproduction // "Não informado"')")
            SUGGESTION=$(sanitize "$(echo "$row" | jq -r '.suggestion // "Não informado"')")
            ARCHITECTURE=$(sanitize "$(echo "$row" | jq -r '.suggested_architecture // "Não informado"')")
            REFACTOR=$(sanitize "$(echo "$row" | jq -r '.recommended_refactor // "Não informado"')")
            EXAMPLE=$(sanitize "$(echo "$row" | jq -r '.example // "Não informado"')")
            BDD_REWRITE=$(sanitize "$(echo "$row" | jq -r '.bdd_rewrite // "Não informado"')")
            KEYWORD_STRATEGY=$(sanitize "$(echo "$row" | jq -r '.keyword_strategy // "Não informado"')")
            MODULARIZATION=$(sanitize "$(echo "$row" | jq -r '.modularization_strategy // "Não informado"')")
            FOLDER_ORGANIZATION=$(sanitize "$(echo "$row" | jq -r '.folder_organization // "Não informado"')")
            VALIDATION_IMPROVEMENTS=$(sanitize "$(echo "$row" | jq -r '.validation_improvements // "Não informado"')")
            CICD_IMPROVEMENTS=$(sanitize "$(echo "$row" | jq -r '.cicd_improvements // "Não informado"')")
            BENEFITS=$(sanitize "$(echo "$row" | jq -r '.benefits // "Não informado"')")
            COMPLEXITY=$(sanitize "$(echo "$row" | jq -r '.complexity // "Não informado"')")
            DEBT_REDUCTION=$(sanitize "$(echo "$row" | jq -r '.technical_debt_reduction // "Não informado"')")
            FLAKY_REDUCTION=$(sanitize "$(echo "$row" | jq -r '.flaky_reduction // "Não informado"')")
            MAINTAINABILITY_GAIN=$(sanitize "$(echo "$row" | jq -r '.maintainability_gain // "Não informado"')")
            IMPROVEMENT_TYPE=$(sanitize "$(echo "$row" | jq -r '.improvement_type // "Melhoria Técnica"')")

            # ================================
            # FILES
            # ================================

            FILES_FORMATTED=""

            FILES_COUNT=$(echo "$row" | jq '.files | length' 2>/dev/null || echo "0")

            if [ "$FILES_COUNT" -gt 0 ]; then
              FILES_FORMATTED=$(echo "$row" | jq -r '.files[]' | while read -r file; do
                echo "- \`$file\`"
              done)
            else
              FILES_FORMATTED="- Não identificado"
            fi

            # ================================
            # BODY
            # ================================

            BODY="
            ## 📌 Categoria
            $CATEGORY

            ## 🔥 Prioridade
            $PRIORITY

            ## 🚨 Severidade
            $SEVERITY

            ## 🏷️ Tipo da Melhoria
            $IMPROVEMENT_TYPE

            ---

            # 📂 Arquivos Afetados

            $FILES_FORMATTED

            ---

            # 📝 Problema Identificado

            $PROBLEM

            ---

            # 📊 Impacto Técnico

            $TECHNICAL_IMPACT

            ---

            # 💼 Impacto no Negócio

            $BUSINESS_IMPACT

            ---

            # 📈 Impacto de Escalabilidade

            $SCALABILITY_IMPACT

            ---

            # 🛠️ Impacto de Manutenção

            $MAINTENANCE_IMPACT

            ---

            # ⚠️ Risco Atual

            $RISK

            ---

            # 🔎 Causa Raiz

            $ROOT_CAUSE

            ---

            # 🧪 Como Reproduzir

            $REPRODUCTION

            ---

            # 💡 Sugestão Técnica

            $SUGGESTION

            ---

            # 🧱 Refatoração Recomendada

            $REFACTOR

            ---

            # 🏗️ Arquitetura Sugerida

            $ARCHITECTURE

            ---

            # 🛠️ Exemplo Técnico

            $EXAMPLE

            ---

            # 🧠 Exemplo Ideal BDD

            $BDD_REWRITE

            ---

            # ♻️ Estratégia de Reutilização

            $KEYWORD_STRATEGY

            ---

            # 🧩 Estratégia de Modularização

            $MODULARIZATION

            ---

            # 📁 Organização Recomendada

            $FOLDER_ORGANIZATION

            ---

            # ✅ Melhorias de Validação

            $VALIDATION_IMPROVEMENTS

            ---

            # 🚀 Melhorias CI/CD

            $CICD_IMPROVEMENTS

            ---

            # 🎯 Benefícios Esperados

            $BENEFITS

            ---

            # 📈 Complexidade Estimada

            $COMPLEXITY

            ---

            # 🧹 Redução de Dívida Técnica

            $DEBT_REDUCTION

            ---

            # 🧪 Redução de Flaky Tests

            $FLAKY_REDUCTION

            ---

            # 📚 Ganho de Manutenibilidade

            $MAINTAINABILITY_GAIN
            "

            # ================================
            # AVOID DUPLICATES
            # ================================

            EXISTING=$(gh issue list \
              --search "$TITLE in:title" \
              --state all \
              --json title \
              --jq '.[0].title // empty' 2>/dev/null || echo "")

            if [ -n "$EXISTING" ]; then
              echo "⚠️ Issue já existe: $TITLE"
              continue
            fi

            echo "🚀 Criando issue: $TITLE"

            # ================================
            # LABELS
            # ================================

            LABELS="ai-audit"

            PRIORITY_SLUG=$(echo "$PRIORITY" | tr '[:upper:]' '[:lower:]')

            case "$PRIORITY_SLUG" in
              crítica|critica|critical)
                LABELS="$LABELS,priority-critical"
                ;;
              alta|high)
                LABELS="$LABELS,priority-high"
                ;;
              média|media|medium)
                LABELS="$LABELS,priority-medium"
                ;;
              baixa|low)
                LABELS="$LABELS,priority-low"
                ;;
            esac

            CATEGORY_SLUG=$(echo "$CATEGORY" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/ /-/g' \
              | sed 's/[^a-z0-9_-]//g')

            if [ -n "$CATEGORY_SLUG" ]; then
              CATEGORY_LABEL="category-$CATEGORY_SLUG"

              create_label_if_not_exists "$CATEGORY_LABEL" "1D76DB"

              LABELS="$LABELS,$CATEGORY_LABEL"
            fi

            # ================================
            # CREATE ISSUE
            # ================================

            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "$LABELS"

            if [ $? -eq 0 ]; then
              echo "✅ Issue criada: $TITLE"
            else
              echo "❌ Erro ao criar issue: $TITLE"
            fi

            sleep 1

          done

          echo "✅ Auditoria finalizada"