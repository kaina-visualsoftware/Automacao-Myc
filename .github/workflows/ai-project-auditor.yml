name: AI PROJECT AUDITOR

on:
  push:
    branches:
      - develop

  workflow_dispatch:
  
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit-project:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📡 FETCH HISTORY
        run: |
          git fetch --all

      - name: 📂 SCAN PROJECT FILES
        run: |
          echo "🔍 Escaneando projeto..."

          find . \
            -type f \
            \( \
              -name "*.robot" -o \
              -name "*.resource" -o \
              -name "*.py" -o \
              -name "*.js" -o \
              -name "*.ts" -o \
              -name "*.json" -o \
              -name "*.md" -o \
              -name "*.yml" -o \
              -name "*.yaml" \
            \) \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" \
            > project_files.txt

          echo "✅ Arquivos encontrados:"
          wc -l project_files.txt

      - name: 📄 BUILD PROJECT CONTEXT
        run: |
          echo "📄 Gerando contexto do projeto..."

          > project_context.txt

          echo "===== ESTRUTURA DO PROJETO =====" >> project_context.txt
          head -200 project_files.txt >> project_context.txt

          echo "" >> project_context.txt
          echo "===== AMOSTRA DE CONTEÚDO =====" >> project_context.txt

          while read file; do
            echo "" >> project_context.txt
            echo "FILE: $file" >> project_context.txt
            echo "----------------------------------------" >> project_context.txt

            head -80 "$file" >> project_context.txt 2>/dev/null || true

          done < <(head -20 project_files.txt)

          echo "" >> project_context.txt
          echo "===== ÚLTIMOS COMMITS =====" >> project_context.txt

          git log -20 --pretty=format:"%h - %s" >> project_context.txt

          echo "✅ Contexto gerado"

      - name: 🤖 AI AUDIT
        id: ai_audit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🤖 Executando auditoria IA..."

          PROJECT_CONTEXT=$(head -c 120000 project_context.txt)

          PROMPT=$(cat <<EOF
          Você é um especialista SÊNIOR em:

          - Robot Framework
          - QA Automation
          - Arquitetura de testes
          - BDD
          - Engenharia de software
          - Refatoração
          - Clean Code
          - Escalabilidade
          - Padrões de automação
          - Revisão técnica
          - Product Ownership técnico
          - Liderança técnica QA

          Você está atuando como:
          - QA Senior
          - Dev Senior
          - Arquiteto de automação
          - Revisor técnico do projeto
          - PO técnico

          Sua missão é realizar uma AUDITORIA TÉCNICA PROFUNDA no projeto abaixo.

          Analise profundamente:

          1. Estrutura do projeto
          2. Organização de pastas
          3. Reaproveitamento de keywords
          4. Duplicidade de código
          5. Problemas de BDD
          6. Má nomenclatura
          7. Casos de teste frágeis
          8. Ausência de cenários negativos
          9. Falta de validações
          10. Falta de asserts importantes
          11. Keywords muito grandes
          12. Keywords com múltiplas responsabilidades
          13. Problemas de legibilidade
          14. Possíveis bugs
          15. Fluxos mal desacoplados
          16. Problemas de manutenção
          17. Problemas de escalabilidade
          18. Problemas de performance
          19. Acoplamento excessivo
          20. Falta de parametrização
          21. Casos de teste repetitivos
          22. Uso incorreto de variáveis
          23. Problemas de waits
          24. Problemas de sincronização
          25. Uso incorreto de massa de testes
          26. Melhorias arquiteturais
          27. Melhorias para CI/CD
          28. Melhorias em logs
          29. Melhorias em rastreabilidade
          30. Melhorias em observabilidade
          31. Melhorias em debugging
          32. Melhorias de padronização
          33. Melhorias para reduzir flaky tests
          34. Possíveis gargalos técnicos
          35. Melhorias em reutilização
          36. Melhorias de componentização
          37. Melhorias em organização BDD
          38. Cenários de teste ausentes
          39. Melhorias em cobertura de testes
          40. Melhorias em clareza funcional

          - Gere NO MÁXIMO 10 issues
          - Gere SOMENTE issues realmente relevantes
          - NÃO invente arquivos inexistentes
          - NÃO gere sugestões genéricas
          - Seja extremamente técnico
          - Seja extremamente específico
          - Seja detalhista
          - Explique exatamente ONDE o problema aparece
          - Cite os ARQUIVOS envolvidos
          - Explique o IMPACTO real do problema
          - Explique COMO resolver
          - Explique o GANHO da melhoria
          - Explique os RISCOS atuais
          - Explique exemplos reais encontrados
          - Pense como um QA Senior revisando um projeto enterprise

          Para cada issue encontrada, informe:

          - Título técnico e claro
          - Prioridade real
          - Categoria
          - Arquivos afetados
          - Problema identificado
          - Impacto técnico
          - Impacto no negócio
          - Risco atual
          - Como reproduzir o problema
          - Sugestão detalhada de solução
          - Exemplo técnico prático
          - Benefícios esperados
          - Complexidade estimada
          - Tipo da melhoria

          Use:
          - Crítica
          - Alta
          - Média
          - Baixa

          Exemplos:
          - BDD
          - Arquitetura
          - Refatoração
          - Performance
          - Flaky Test
          - Organização
          - Reutilização
          - Validação
          - Cenário Negativo
          - Bug Potencial
          - Escalabilidade
          - Naming
          - CI/CD
          - Logging
          - Keyword Design
          - Clean Code

          RETORNE APENAS JSON VÁLIDO.

          NÃO use:
          - markdown externo
          - comentários
          - explicações fora do JSON
          - blocos markdown
          - texto adicional

          FORMATO:

          {
            "issues": [
              {
                "title": "Título técnico",
                "priority": "Alta",
                "category": "BDD",
                "files": [
                  "caminho/arquivo.robot",
                  "outro/arquivo.robot"
                ],
                "problem": "Descrição extremamente detalhada do problema encontrado",
                "technical_impact": "Impacto técnico",
                "business_impact": "Impacto no negócio",
                "risk": "Risco atual",
                "reproduction": "Como reproduzir",
                "suggestion": "Solução detalhada",
                "example": "Exemplo técnico prático",
                "benefits": "Benefícios esperados",
                "complexity": "Baixa/Média/Alta",
                "improvement_type": "Refatoração"
              }
            ]
          }

          $PROJECT_CONTEXT
          EOF
          )

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "openai/gpt-4o-mini",
              messages: [
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.1,
              max_tokens: 4000,
              response_format: { "type": "json_object" }
            }')

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "$RESPONSE" > response.json

          echo "📥 Resposta recebida"

          AI_CONTENT=$(jq -r '.choices[0].message.content // empty' response.json)

          if [ -z "$AI_CONTENT" ]; then
            echo "❌ IA não retornou conteúdo"
            cat response.json
            exit 1
          fi

          echo "$AI_CONTENT" > ai_raw.txt

          cat ai_raw.txt | jq . > ai_issues.json 2>/dev/null || \
          python3 -c '
          import sys, json, re
          text = sys.stdin.read()
          match = re.search(r"\{[\s\S]*\}", text)

          if match:
              try:
                  data = json.loads(match.group(0))
                  print(json.dumps(data, ensure_ascii=False))
              except:
                  print("{\"issues\": []}")
          else:
              print("{\"issues\": []}")
          ' < ai_raw.txt > ai_issues.json 2>/dev/null || \
          echo '{"issues": []}' > ai_issues.json

          echo "✅ JSON validado"

          jq . ai_issues.json

      - name: 🐞 CREATE GITHUB ISSUES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🐞 Criando issues..."

          TOTAL=$(jq '.issues | length' ai_issues.json 2>/dev/null || echo 0)

          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️ Nenhuma issue encontrada"
            exit 0
          fi

          jq -c '.issues[]' ai_issues.json | while read -r row; do

            TITLE=$(echo "$row" | jq -r '.title // "Issue sem título"')
            PRIORITY=$(echo "$row" | jq -r '.priority // "Média"')
            CATEGORY=$(echo "$row" | jq -r '.category // "Geral"')

            # Handle files array properly
            FILES_FORMATTED=""
            FILES_COUNT=$(echo "$row" | jq '.files | length' 2>/dev/null || echo "0")
            
            if [ "$FILES_COUNT" -gt 0 ]; then
              # Build file list with proper line breaks
              FILES_FORMATTED=$(echo "$row" | jq -r '.files[]' | while read -r file; do
                echo "- \`$file\`"
              done)
            else
              FILES_FORMATTED="- Não identificado"
            fi

            PROBLEM=$(echo "$row" | jq -r '.problem // "Não informado"')
            TECHNICAL_IMPACT=$(echo "$row" | jq -r '.technical_impact // "Não informado"')
            BUSINESS_IMPACT=$(echo "$row" | jq -r '.business_impact // "Não informado"')
            RISK=$(echo "$row" | jq -r '.risk // "Não informado"')
            REPRODUCTION=$(echo "$row" | jq -r '.reproduction // "Não informado"')
            SUGGESTION=$(echo "$row" | jq -r '.suggestion // "Não informado"')
            EXAMPLE=$(echo "$row" | jq -r '.example // "Não informado"')
            BENEFITS=$(echo "$row" | jq -r '.benefits // "Não informado"')
            COMPLEXITY=$(echo "$row" | jq -r '.complexity // "Não informado"')
            IMPROVEMENT_TYPE=$(echo "$row" | jq -r '.improvement_type // "Melhoria Técnica"')

            # Build body as a simple string
            BODY="## 📌 Categoria
            $CATEGORY

            ## 🔥 Prioridade
            $PRIORITY

            ## 🏷️ Tipo da Melhoria
            $IMPROVEMENT_TYPE

            ## 📂 Arquivos Afetados
            $FILES_FORMATTED

            ## 📝 Problema Identificado
            $PROBLEM

            ## 📊 Impacto Técnico
            $TECHNICAL_IMPACT

            ## 💼 Impacto no Negócio
            $BUSINESS_IMPACT

            ## ⚠️ Risco Atual
            $RISK

            ## 🧪 Como Reproduzir
            $REPRODUCTION

            ## 💡 Sugestão Técnica
            $SUGGESTION

            ## 🛠️ Exemplo Técnico
            $EXAMPLE

            ## ✅ Benefícios Esperados
            $BENEFITS

            ## 📈 Complexidade Estimada
            $COMPLEXITY"

            # Check if issue already exists
            EXISTING=$(gh issue list \
              --search "$TITLE in:title" \
              --state all \
              --json title \
              --jq '.[0].title // empty' 2>/dev/null || echo "")

            if [ -n "$EXISTING" ]; then
              echo "⚠️ Issue já existe: $TITLE"
              continue
            fi

            echo "🚀 Criando issue: $TITLE"

            # Create issue with label based on priority
            LABEL=""
            case "$PRIORITY" in
              "Alta"|"alta"|"High"|"high")
                LABEL="--label priority-high"
                ;;
              "Média"|"média"|"Medium"|"medium")
                LABEL="--label priority-medium"
                ;;
              "Baixa"|"baixa"|"Low"|"low")
                LABEL="--label priority-low"
                ;;
              *)
                LABEL=""
                ;;
            esac

            # Add category label
            CATEGORY_LABEL=""
            if [ -n "$CATEGORY" ] && [ "$CATEGORY" != "Geral" ]; then
              CATEGORY_SLUG=$(echo "$CATEGORY" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g')
              CATEGORY_LABEL="--label category-$CATEGORY_SLUG"
            fi

            # Create the issue with proper labels
            if [ -n "$LABEL" ] || [ -n "$CATEGORY_LABEL" ]; then
              gh issue create \
                --title "$TITLE" \
                --body "$BODY" \
                $LABEL \
                $CATEGORY_LABEL 2>/dev/null || {
                  # Fallback without labels if label doesn't exist
                  gh issue create \
                    --title "$TITLE" \
                    --body "$BODY" 2>/dev/null
                }
            else
              gh issue create \
                --title "$TITLE" \
                --body "$BODY" 2>/dev/null
            fi

            if [ $? -eq 0 ]; then
              echo "✅ Issue criada: $TITLE"
            else
              echo "❌ Erro ao criar issue: $TITLE"
            fi

            # Small delay to avoid rate limiting
            sleep 1

          done

          echo "✅ Auditoria finalizada"